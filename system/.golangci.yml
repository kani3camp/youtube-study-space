version: "2"

linters:
  default: standard
  enable:
    - nolintlint
    - wrapcheck
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: app.modules
    goimports:
      local-prefixes:
        - app.modules
