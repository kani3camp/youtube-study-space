<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Study Space</title>
  <desc id="desc">A stylized 24/7 virtual study room controlled through YouTube live chat.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="28" x2="1120" y2="602" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152448"/>
      <stop offset="0.52" stop-color="#24386A"/>
      <stop offset="1" stop-color="#13213E"/>
    </linearGradient>
    <linearGradient id="room" x1="282" y1="157" x2="820" y2="518" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6EBD8"/>
      <stop offset="1" stop-color="#DCC7A4"/>
    </linearGradient>
    <linearGradient id="window" x1="370" y1="183" x2="690" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82B9D6"/>
      <stop offset="1" stop-color="#D8E8EC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#081226" flood-opacity="0.35"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#101A31" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#background)"/>
  <circle cx="108" cy="92" r="152" fill="#5F7DD4" fill-opacity="0.13"/>
  <circle cx="1115" cy="555" r="208" fill="#67D6C1" fill-opacity="0.10"/>
  <path d="M0 516C191 455 338 478 511 532C683 586 878 599 1200 470V630H0V516Z" fill="#0B1730" fill-opacity="0.45"/>

  <g aria-label="Heading">
    <rect x="72" y="58" width="110" height="34" rx="17" fill="#FF3B30"/>
    <circle cx="94" cy="75" r="6" fill="white"/>
    <text x="108" y="81" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">LIVE</text>
    <text x="72" y="142" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800" letter-spacing="-1.4">YouTube Study Space</text>
    <text x="74" y="181" fill="#CBD7F3" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500">A virtual room for focused work — open 24/7.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="71" y="224" width="1058" height="326" rx="24" fill="#F8FAFF"/>
    <rect x="71" y="224" width="1058" height="46" rx="24" fill="#E7ECF7"/>
    <rect x="71" y="248" width="1058" height="22" fill="#E7ECF7"/>
    <circle cx="102" cy="247" r="7" fill="#FF6B63"/>
    <circle cx="127" cy="247" r="7" fill="#FFBE4F"/>
    <circle cx="152" cy="247" r="7" fill="#5BCB69"/>
    <rect x="194" y="237" width="450" height="20" rx="10" fill="#D4DBEA"/>
    <text x="216" y="252" fill="#697690" font-family="Arial, Helvetica, sans-serif" font-size="12">youtube.com/live · study room</text>

    <clipPath id="roomClip"><rect x="87" y="286" width="697" height="246" rx="14"/></clipPath>
    <g clip-path="url(#roomClip)">
      <rect x="87" y="286" width="697" height="246" fill="url(#room)"/>
      <rect x="87" y="286" width="697" height="109" fill="#E8DDD0"/>
      <rect x="330" y="304" width="216" height="89" rx="8" fill="#5B463D"/>
      <rect x="344" y="317" width="188" height="62" rx="3" fill="url(#window)"/>
      <path d="M438 317V379M344 348H532" stroke="#F7F5EE" stroke-width="6"/>
      <circle cx="366" cy="337" r="9" fill="#FFF6C4" fill-opacity="0.85"/>
      <path d="M87 395H784V532H87V395Z" fill="#B99A72"/>
      <path d="M87 414L784 414M87 452L784 452M87 490L784 490" stroke="#A5845F" stroke-width="2" opacity="0.5"/>

      <g fill="#7D5A45">
        <rect x="151" y="405" width="116" height="15" rx="7.5"/>
        <rect x="166" y="420" width="10" height="55" rx="5"/>
        <rect x="242" y="420" width="10" height="55" rx="5"/>
        <rect x="342" y="430" width="128" height="15" rx="7.5"/>
        <rect x="359" y="445" width="10" height="58" rx="5"/>
        <rect x="443" y="445" width="10" height="58" rx="5"/>
        <rect x="569" y="399" width="125" height="15" rx="7.5"/>
        <rect x="585" y="414" width="10" height="59" rx="5"/>
        <rect x="669" y="414" width="10" height="59" rx="5"/>
      </g>

      <g filter="url(#smallShadow)">
        <circle cx="209" cy="392" r="21" fill="#F3B883"/>
        <path d="M188 390C190 369 228 365 230 392C216 384 203 384 188 390Z" fill="#3A455E"/>
        <rect x="184" y="411" width="50" height="45" rx="18" fill="#6784D8"/>
        <rect x="185" y="382" width="48" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.92"/>
        <text x="209" y="395" text-anchor="middle" fill="#34415D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">READING</text>
      </g>
      <g filter="url(#smallShadow)">
        <circle cx="405" cy="417" r="21" fill="#DB956D"/>
        <path d="M384 415C388 388 426 390 426 417C411 408 400 408 384 415Z" fill="#67422F"/>
        <rect x="380" y="437" width="50" height="45" rx="18" fill="#55A693"/>
        <rect x="382" y="407" width="46" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.92"/>
        <text x="405" y="420" text-anchor="middle" fill="#34415D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">CODING</text>
      </g>
      <g filter="url(#smallShadow)">
        <circle cx="632" cy="386" r="21" fill="#E8B088"/>
        <path d="M611 385C616 359 651 360 653 387C637 378 626 378 611 385Z" fill="#4E3152"/>
        <rect x="607" y="406" width="50" height="45" rx="18" fill="#C66B82"/>
        <rect x="607" y="376" width="50" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.92"/>
        <text x="632" y="389" text-anchor="middle" fill="#34415D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">STUDY</text>
      </g>

      <g opacity="0.92">
        <rect x="104" y="303" width="128" height="28" rx="14" fill="#152448"/>
        <circle cx="122" cy="317" r="5" fill="#63D7BC"/>
        <text x="136" y="322" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">24/7 ONLINE</text>
      </g>
    </g>

    <g aria-label="Live chat panel">
      <rect x="801" y="286" width="312" height="246" rx="14" fill="#FFFFFF"/>
      <text x="823" y="315" fill="#26324A" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Live chat</text>
      <line x1="801" y1="329" x2="1113" y2="329" stroke="#E6EAF2"/>

      <circle cx="827" cy="358" r="13" fill="#6784D8"/>
      <text x="850" y="354" fill="#52617A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Alex</text>
      <text x="850" y="372" fill="#222D42" font-family="Arial, Helvetica, sans-serif" font-size="14">!in English min 60</text>

      <circle cx="827" cy="407" r="13" fill="#55A693"/>
      <text x="850" y="403" fill="#52617A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Study Space Bot</text>
      <text x="850" y="421" fill="#222D42" font-family="Arial, Helvetica, sans-serif" font-size="14">Welcome! Seat 18 is yours.</text>

      <circle cx="827" cy="456" r="13" fill="#C66B82"/>
      <text x="850" y="452" fill="#52617A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Mina</text>
      <text x="850" y="470" fill="#222D42" font-family="Arial, Helvetica, sans-serif" font-size="14">!break</text>

      <rect x="817" y="492" width="280" height="27" rx="13.5" fill="#F0F3F9"/>
      <text x="835" y="510" fill="#8B96AA" font-family="Arial, Helvetica, sans-serif" font-size="12">Type a command...</text>
    </g>
  </g>

  <g aria-label="Feature labels">
    <rect x="72" y="574" width="174" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="159" y="595" text-anchor="middle" fill="#E8EEFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">NO APP REQUIRED</text>
    <rect x="260" y="574" width="184" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="352" y="595" text-anchor="middle" fill="#E8EEFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">CHAT-CONTROLLED</text>
    <rect x="458" y="574" width="214" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="565" y="595" text-anchor="middle" fill="#E8EEFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">REAL-TIME ROOM VIEW</text>
  </g>
</svg>
