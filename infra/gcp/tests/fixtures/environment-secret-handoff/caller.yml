# Inert fixture: this directory is outside .github/workflows.
name: Synthetic environment secret handoff comparison

on:
  workflow_dispatch:

permissions: {}

jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: synthetic-secret-handoff
    steps:
      - name: Classify synthetic inputs without revealing values
        shell: bash
        env:
          SYNTHETIC_A: ${{ secrets.SYNTHETIC_A }}
          SYNTHETIC_B: ${{ secrets.SYNTHETIC_B }}
        run: |
          set +x
          set -euo pipefail
          classify() {
            if [[ -z "$1" ]]; then
              printf 'absent'
            elif [[ "$1" == "$2" ]]; then
              printf 'expected'
            else
              printf 'unexpected'
            fi
          }
          {
            printf -- '- SYNTHETIC_A: %s\n' "$(classify "${SYNTHETIC_A-}" 'synthetic-alpha')"
            printf -- '- SYNTHETIC_B: %s\n' "$(classify "${SYNTHETIC_B-}" 'synthetic-beta')"
          } >> "${GITHUB_STEP_SUMMARY:?missing summary path}"

  reusable_without_contract:
    uses: ./.github/workflows/synthetic-secret-handoff-reusable.yml

  reusable_with_contract:
    uses: ./.github/workflows/synthetic-secret-handoff-declared.yml
    secrets:
      SYNTHETIC_A: ${{ secrets.SYNTHETIC_A }}
      SYNTHETIC_B: ${{ secrets.SYNTHETIC_B }}
