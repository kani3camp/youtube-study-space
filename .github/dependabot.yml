# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# NOTE: このファイルは authoritative な設定です。ここに記載されていない
#       ecosystem / directory の version update は走りません。新しい
#       package.json や Dockerfile を追加したときは必ずここにも追記。
version: 2
updates:
  # =========================
  # Docker ベースイメージ（#693: 再現可能ビルドのため digest 固定を自動更新）
  # =========================
  - package-ecosystem: docker
    directories:
      - /system
      - /.github/ci-validation
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: build(deps)
    open-pull-requests-limit: 5

  # =========================
  # Go modules
  # minor / patch はまとめる
  # major は個別PR
  # =========================
  - package-ecosystem: gomod
    directories:
      - /system
      - /tools/room-image-prompt
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: build(deps)
    open-pull-requests-limit: 10
    groups:
      go-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # =========================
  # npm / pnpm projects
  # minor / patch は全サブプロジェクト横断でまとめる
  # major は個別PR
  # =========================
  - package-ecosystem: npm
    directories:
      - /youtube-monitor
      - /aws-cdk
      - /docs-site
      - /firebase
      - /tools/menu-image-generator
      - /tools/video-maker/1000-minutes-simulator
      - /tools/figma-plugin/room-layout-analyzer
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: build(deps)
    open-pull-requests-limit: 10
    # Keep @types/node aligned with the runtime major in .node-version.
    # CI requires the first ignored major to be runtime major + 1.
    ignore:
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # MyPageフロントエンド（脆弱性対応を早めるため日次更新。既定ブランチへ統合後に有効化）
  - package-ecosystem: npm
    directory: /mypage
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: build(deps)
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
    groups:
      mypage-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # =========================
  # GitHub Actions
  # minor / patch はまとめる
  # major は個別PR
  # =========================
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: build(deps)
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # =========================
  # Terraform（意図的に Dependabot 対象外・手動管理）
  # =========================
  # infra/{gcp,mypage-platform,mypage-oauth-ttl}/environments/{dev,prod}/.terraform.lock.hcl
  # は、マルチプラットフォーム checksum（linux_amd64 / darwin_arm64）および dev/prod・ルート間の
  # lockfile 一致を CI（.github/ci-validation/validate.sh / infra/mypage-platform/scripts/check-local.sh）
  # で強制しており、保護された環境別 Plan/Apply レビューとネイティブテスト更新を伴うため、
  # Dependabot の自動 PR ではなく手動 PR で一括更新する。
