name: Generate dependency lockfiles

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Generate menu image generator lockfile
        working-directory: tools/menu-image-generator
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Generate video maker simulator lockfile
        working-directory: tools/video-maker/1000-minutes-simulator
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Generate YouTube monitor lockfile
        working-directory: youtube-monitor
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Upload lockfiles
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-lockfiles
          path: |
            tools/menu-image-generator/pnpm-lock.yaml
            tools/video-maker/1000-minutes-simulator/pnpm-lock.yaml
            youtube-monitor/pnpm-lock.yaml
