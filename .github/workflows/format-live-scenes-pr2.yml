name: Format Live Scenes PR2

on:
  push:
    branches:
      - tooling/format-live-scenes-pr2

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: youtube-monitor/pnpm-lock.yaml
      - name: Install
        working-directory: youtube-monitor
        run: pnpm install --frozen-lockfile
      - name: Apply Biome safe fixes
        working-directory: youtube-monitor
        run: pnpm exec biome check --write .
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-pr2
          path: |
            youtube-monitor/src/components/RoomVisual.tsx
            youtube-monitor/src/components/RoomVisual.test.tsx
            youtube-monitor/src/hooks/use-scene-clock-css-variables.ts
            youtube-monitor/src/lib/scene-clock.ts
            youtube-monitor/src/lib/scene-clock.test.ts
            youtube-monitor/src/pages/index.tsx
          if-no-files-found: error
          retention-days: 1
