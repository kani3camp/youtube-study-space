name: GCP Runtime Ownership Contracts

on:
  pull_request:
    paths:
      - 'infra/gcp/**'
      - '.github/scripts/terraform_plan_summary.py'
      - '.github/scripts/terraform_protected_plan.py'
      - '.github/scripts/*terraform*receipt*.py'
      - '.github/scripts/*terraform*history_import*.py'
      - '.github/terraform/runtime-receipt-sources.json'
      - '.github/workflows/gcp-terraform-authenticated.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/gcp-runtime-ownership-contracts.yml'

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.4'
          terraform_wrapper: false
      - name: Verify dummy inventory and mock ownership plans
        run: |
          python3 infra/gcp/tests/test_runtime_ownership.py
          python3 infra/gcp/tests/test_runtime_ownership_package.py
          python3 infra/gcp/tests/test_runtime_ownership_provenance.py
          python3 .github/scripts/test_terraform_ownership_receipt.py
          python3 .github/scripts/test_terraform_history_import_verifier.py
