name: Temporary Format YouTube Monitor

on:
  push:
    branches:
      - codex/time-ambient-theme

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-monitor
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/time-ambient-theme
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: youtube-monitor/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: youtube-monitor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format changed theme files
        run: |
          pnpm exec biome format --write \
            src/lib/time-theme-colors.ts \
            src/styles/AmbientFrame.styles.ts \
            src/lib/color-contrast.test.ts
      - name: Commit formatter output
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            youtube-monitor/src/lib/time-theme-colors.ts \
            youtube-monitor/src/styles/AmbientFrame.styles.ts \
            youtube-monitor/src/lib/color-contrast.test.ts
          git commit -m "style(youtube-monitor): apply biome formatting"
          git push origin HEAD:codex/time-ambient-theme
