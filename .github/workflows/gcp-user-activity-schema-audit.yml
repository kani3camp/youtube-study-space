name: GCP User Activity Schema Audit

on:
  workflow_call:
    inputs:
      target:
        description: Read-only schema audit target
        required: true
        type: string
    # Match the existing Terraform workflow's explicit Environment-secret contract.
    secrets:
      GCP_TERRAFORM_WIF_PROVIDER:
        required: false
      GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT:
        required: false

permissions: {}

env:
  DEV_USER_ACTIVITY_SCHEMA_AUDIT_ENABLED: "false"
  USER_ACTIVITY_SCHEMA_AUDIT_MAX_BYTES_BILLED: "1073741824"

jobs:
  audit:
    name: Development user-activity schema audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: gcp-dev-user-activity-schema-audit
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Enforce trusted read-only audit surface
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || {
            echo "::error::Schema audit only supports workflow_dispatch."
            exit 1
          }
          [[ "${GITHUB_REPOSITORY}" == "kani3camp/youtube-study-space" ]] || {
            echo "::error::Unexpected repository."
            exit 1
          }
          [[ "${GITHUB_REPOSITORY_ID}" == "340900071" ]] || {
            echo "::error::Unexpected immutable repository ID."
            exit 1
          }
          [[ "${GITHUB_REPOSITORY_OWNER_ID}" == "54093651" ]] || {
            echo "::error::Unexpected immutable repository owner ID."
            exit 1
          }
          [[ "${GITHUB_WORKFLOW_REF}" == "kani3camp/youtube-study-space/.github/workflows/ci.yml@refs/heads/feature/gcp-terraform-iac" ]] || {
            echo "::error::Schema audit must be called from ci.yml at the trusted integration ref."
            exit 1
          }
          [[ "${GITHUB_REF}" == "refs/heads/feature/gcp-terraform-iac" ]] || {
            echo "::error::Schema audit is restricted to the integration branch."
            exit 1
          }
          [[ "${TARGET}" == "dev" ]] || {
            echo "::error::Production schema audit is not enabled by this workflow."
            exit 1
          }
          [[ "${DEV_USER_ACTIVITY_SCHEMA_AUDIT_ENABLED}" == "true" ]] || {
            echo "::error::Development schema audit remains disabled pending dedicated IAM and user approval."
            exit 1
          }

      - name: Checkout trusted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v7
        with:
          go-version-file: system/go.mod
          cache: true
          cache-dependency-path: |
            system/go.sum
            system/go.mod

      - name: Mask private identity fragments before authentication
        shell: bash
        env:
          PRIVATE_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
          PRIVATE_AUDIT_SA: ${{ secrets.GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ "${PRIVATE_WIF_PROVIDER}" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]] && \
            [[ "${PRIVATE_AUDIT_SA}" =~ ^[a-z0-9-]+@test-youtube-study-space\.iam\.gserviceaccount\.com$ ]] || {
              echo "::error::Missing or invalid dedicated audit identity configuration."
              exit 1
            }
          for value in "${PRIVATE_WIF_PROVIDER}" "${PRIVATE_AUDIT_SA}" "${PRIVATE_AUDIT_SA%%@*}"; do
            echo "::add-mask::${value}"
          done
          IFS=/ read -r _ project_number _ _ _ pool_id _ provider_id <<< "${PRIVATE_WIF_PROVIDER}"
          for value in "${project_number}" "${pool_id}" "${provider_id}"; do
            echo "::add-mask::${value}"
          done

      - name: Configure dedicated GCP audit credential
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT }}
          project_id: test-youtube-study-space
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
          token_format: access_token
          access_token_lifetime: 600s

      - name: Run aggregate-only audit without public data output
        shell: bash
        working-directory: system
        run: |
          set -euo pipefail
          : "${GOOGLE_APPLICATION_CREDENTIALS:?missing GCP audit credential file}"
          umask 077
          if ! CREDENTIAL_FILE_LOCATION="${GOOGLE_APPLICATION_CREDENTIALS}" \
            go run ./cmd/user-activity-schema-audit \
              development \
              test-youtube-study-space \
              asia-southeast2 \
              >"${RUNNER_TEMP}/user-activity-schema-audit.json" \
              2>"${RUNNER_TEMP}/user-activity-schema-audit.stderr"; then
            echo "::error::Schema audit failed. Private output is intentionally not printed."
            exit 1
          fi

      - name: Publish sanitized audit decision only
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/gcp/scripts/schema_audit_summary.py \
            "${RUNNER_TEMP}/user-activity-schema-audit.json" \
            "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup private audit output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/user-activity-schema-audit.json" "${RUNNER_TEMP}/user-activity-schema-audit.stderr"
          rm -f "${GITHUB_WORKSPACE}"/gha-creds-*.json
