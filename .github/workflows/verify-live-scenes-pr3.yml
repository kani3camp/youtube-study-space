name: Verify Live Scenes PR3

on:
  push:
    branches:
      - feature/live-room-scenes-pr3-pixi-runtime

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/live-room-scenes-pr3-pixi-runtime
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: youtube-monitor/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: youtube-monitor/pnpm-lock.yaml
      - name: Install
        working-directory: youtube-monitor
        run: pnpm install --frozen-lockfile
      - name: Apply Biome safe fixes
        working-directory: youtube-monitor
        run: pnpm exec biome check --write .
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-monitor
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR3をBiomeで整形"
          git push origin HEAD:feature/live-room-scenes-pr3-pixi-runtime
      - name: Test
        working-directory: youtube-monitor
        run: pnpm test
      - name: Build
        working-directory: youtube-monitor
        run: pnpm build
