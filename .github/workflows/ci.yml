name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mypage_backend:
        description: Deploy and verify the reviewed MyPage DEV Backend image
        required: false
        default: false
        type: boolean
      mypage_backend_expected_sha:
        description: Exact reviewed MyPage integration SHA for Backend
        required: false
        type: string
      mypage_hosting:
        description: Build, apply and verify the MyPage DEV Hosting page
        required: false
        default: false
        type: boolean
      mypage_hosting_expected_sha:
        description: Exact reviewed MyPage integration SHA for Hosting
        required: false
        type: string
      mypage_foundation:
        description: Run isolated staged MyPage Development or Production provisioning
        required: false
        default: false
        type: boolean
      mypage_foundation_target:
        description: "MyPage target (Production bootstrap: registry plan/apply, image-build, then maintenance operator/upgrade plan/apply)"
        required: false
        default: development
        type: choice
        options:
          - development
          - production
      mypage_foundation_mode:
        description: MyPage staged Development or Production provisioning operation
        required: false
        default: foundation-metadata-plan
        type: choice
        options:
          - foundation-metadata-plan
          - foundation-metadata-apply
          - foundation-plan
          - foundation-apply
          - registry-plan
          - registry-apply
          - image-build
          - maintenance-operator-plan
          - maintenance-operator-apply
          - maintenance-upgrade-plan
          - maintenance-upgrade-apply
          - runtime-private-plan
          - runtime-private-apply
          - runtime-public-plan
          - runtime-public-apply
      mypage_foundation_expected_sha:
        description: Exact SHA on the selected target's required ref
        required: false
        type: string
      terraform_authenticated:
        description: Authenticated Terraform
        required: false
        default: false
        type: boolean
      terraform_target:
        description: Terraform target environment
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod
      terraform_mode:
        description: Terraform operation
        required: false
        default: migration-plan
        type: choice
        options:
          - migration-plan
          - migration-apply
          - normal-plan
          - normal-apply
          - normal-e2e
      terraform_expected_sha:
        description: Exact selected branch SHA for normal operations
        required: false
        type: string
      gcp_user_activity_schema_audit:
        description: Run the fail-closed development user-activity schema audit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.terraform_authenticated == true || inputs.gcp_user_activity_schema_audit == true || inputs.mypage_foundation == true || inputs.mypage_hosting == true || inputs.mypage_backend == true)) }}

jobs:
  changes:
    name: Detect CI Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      system: ${{ steps.detect.outputs.system }}
      room_image_prompt: ${{ steps.detect.outputs.room_image_prompt }}
      menu_image_generator: ${{ steps.detect.outputs.menu_image_generator }}
      video_maker_simulator: ${{ steps.detect.outputs.video_maker_simulator }}
      figma_plugin: ${{ steps.detect.outputs.figma_plugin }}
      youtube_monitor: ${{ steps.detect.outputs.youtube_monitor }}
      mypage: ${{ steps.detect.outputs.mypage }}
      docs_site: ${{ steps.detect.outputs.docs_site }}
      aws_cdk: ${{ steps.detect.outputs.aws_cdk }}
      gcp_terraform: ${{ steps.detect.outputs.gcp_terraform }}
      node_projects: ${{ steps.detect.outputs.node_projects }}
      firestore_integration: ${{ steps.detect.outputs.firestore_integration }}
      formal_spec: ${{ steps.detect.outputs.formal_spec }}
      all: ${{ steps.detect.outputs.all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test CI path detector
        run: bash .github/scripts/test-detect-ci-paths.sh

      - name: Detect changed paths
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_AUTHENTICATED_TERRAFORM_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && (inputs.terraform_authenticated == true || inputs.gcp_user_activity_schema_audit == true || inputs.mypage_foundation == true) }}
        run: bash .github/scripts/detect-ci-paths.sh

  system:
    name: System
    needs: changes
    if: ${{ needs.changes.outputs.system == 'true' || needs.changes.outputs.all == 'true' || needs.changes.outputs.firestore_integration == 'true' }}
    uses: ./.github/workflows/ci-system.yml
    with:
      system: ${{ needs.changes.outputs.system == 'true' || needs.changes.outputs.all == 'true' }}
      firestore_integration: ${{ needs.changes.outputs.firestore_integration == 'true' || needs.changes.outputs.all == 'true' }}

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.youtube_monitor == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' || needs.changes.outputs.docs_site == 'true' || needs.changes.outputs.mypage == 'true' }}
    uses: ./.github/workflows/ci-frontend.yml
    with:
      youtube_monitor: ${{ needs.changes.outputs.youtube_monitor == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
      docs_site: ${{ needs.changes.outputs.docs_site == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
      mypage: ${{ needs.changes.outputs.mypage == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}

  tools:
    name: Tools
    needs: changes
    if: ${{ needs.changes.outputs.formal_spec == 'true' || needs.changes.outputs.all == 'true' || needs.changes.outputs.room_image_prompt == 'true' || needs.changes.outputs.menu_image_generator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.video_maker_simulator == 'true' || needs.changes.outputs.figma_plugin == 'true' }}
    uses: ./.github/workflows/ci-tools.yml
    with:
      formal_spec: ${{ needs.changes.outputs.formal_spec == 'true' || needs.changes.outputs.all == 'true' }}
      room_image_prompt: ${{ needs.changes.outputs.room_image_prompt == 'true' || needs.changes.outputs.all == 'true' }}
      menu_image_generator: ${{ needs.changes.outputs.menu_image_generator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
      video_maker_simulator: ${{ needs.changes.outputs.video_maker_simulator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
      figma_plugin: ${{ needs.changes.outputs.figma_plugin == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}

  infra:
    name: Infra
    needs: changes
    if: ${{ needs.changes.outputs.aws_cdk == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    uses: ./.github/workflows/ci-infra.yml

  repository:
    name: Repository
    uses: ./.github/workflows/ci-repository.yml

  gcp-terraform-validate:
    name: GCP Terraform
    needs: changes
    if: ${{ needs.changes.outputs.gcp_terraform == 'true' || needs.changes.outputs.all == 'true' }}
    uses: ./.github/workflows/ci-gcp-terraform.yml

  operations:
    name: Authenticated Operations
    needs: [repository, frontend, system, gcp-terraform-validate]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.terraform_authenticated == true || inputs.gcp_user_activity_schema_audit == true || inputs.mypage_foundation == true || inputs.mypage_hosting == true || inputs.mypage_backend == true) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-operations.yml
    with:
      terraform_authenticated: ${{ inputs.terraform_authenticated }}
      terraform_target: ${{ inputs.terraform_target }}
      terraform_mode: ${{ inputs.terraform_mode }}
      terraform_expected_sha: ${{ inputs.terraform_expected_sha }}
      gcp_user_activity_schema_audit: ${{ inputs.gcp_user_activity_schema_audit }}
      mypage_foundation: ${{ inputs.mypage_foundation }}
      mypage_foundation_target: ${{ inputs.mypage_foundation_target }}
      mypage_foundation_mode: ${{ inputs.mypage_foundation_mode }}
      mypage_foundation_expected_sha: ${{ inputs.mypage_foundation_expected_sha }}
      mypage_hosting: ${{ inputs.mypage_hosting }}
      mypage_hosting_expected_sha: ${{ inputs.mypage_hosting_expected_sha }}
      mypage_backend: ${{ inputs.mypage_backend }}
      mypage_backend_expected_sha: ${{ inputs.mypage_backend_expected_sha }}
      repository_result: ${{ needs.repository.result }}
      frontend_result: ${{ needs.frontend.result }}
      system_result: ${{ needs.system.result }}
      gcp_terraform_validate_result: ${{ needs.gcp-terraform-validate.result }}
    secrets:
      GCP_TERRAFORM_NORMAL_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_NORMAL_WIF_PROVIDER }}
      GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT }}
      AWS_TERRAFORM_BACKEND_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ARN }}
      AWS_TERRAFORM_BACKEND_ROLE_ID: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ID }}
      AWS_TERRAFORM_STATE_BUCKET: ${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}
      AWS_TERRAFORM_STATE_ACCOUNT_ID: ${{ secrets.AWS_TERRAFORM_STATE_ACCOUNT_ID }}
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      GCP_TERRAFORM_MANAGED_INPUTS_JSON: ${{ secrets.GCP_TERRAFORM_MANAGED_INPUTS_JSON }}
      GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT: ${{ secrets.GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT }}
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      MYPAGE_RUNTIME_SETTINGS_JSON: ${{ secrets.MYPAGE_RUNTIME_SETTINGS_JSON }}

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - system
      - frontend
      - tools
      - infra
      - repository
      - gcp-terraform-validate
      - operations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require successful selected validations
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_OPERATION_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && (inputs.terraform_authenticated == true || inputs.gcp_user_activity_schema_audit == true || inputs.mypage_foundation == true || inputs.mypage_hosting == true || inputs.mypage_backend == true) }}
        run: python3 .github/scripts/check-ci-results.py
