name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      terraform_authenticated:
        description: Run the fail-closed authenticated Terraform flow
        required: false
        default: false
        type: boolean
      terraform_target:
        description: Terraform target environment
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod
      terraform_mode:
        description: Authenticated Terraform mode
        required: false
        default: plan
        type: choice
        options:
          - plan
          - security-probe
          - apply
          - email-adoption
          - quota-plan
          - quota-create
          - quota-refresh
      gcp_user_activity_schema_audit:
        description: Run the fail-closed development user-activity schema audit
        required: false
        default: false
        type: boolean
      terraform_plan_cost_evidence:
        description: Nonsecret read-backed added current UTC month cost bounds; retained storage carries into later months
        required: false
        default: ""
        type: string
      terraform_history_import_approval:
        description: Public one-shot dev import approval binding exact SHA, prior plan digest and UTC expiry
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.terraform_authenticated == true) }}

jobs:
  changes:
    name: Detect CI Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      system: ${{ steps.detect.outputs.system }}
      room_image_prompt: ${{ steps.detect.outputs.room_image_prompt }}
      menu_image_generator: ${{ steps.detect.outputs.menu_image_generator }}
      video_maker_simulator: ${{ steps.detect.outputs.video_maker_simulator }}
      figma_plugin: ${{ steps.detect.outputs.figma_plugin }}
      youtube_monitor: ${{ steps.detect.outputs.youtube_monitor }}
      docs_site: ${{ steps.detect.outputs.docs_site }}
      aws_cdk: ${{ steps.detect.outputs.aws_cdk }}
      gcp_terraform: ${{ steps.detect.outputs.gcp_terraform }}
      node_projects: ${{ steps.detect.outputs.node_projects }}
      firestore_integration: ${{ steps.detect.outputs.firestore_integration }}
      formal_spec: ${{ steps.detect.outputs.formal_spec }}
      all: ${{ steps.detect.outputs.all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test CI path detector
        run: bash .github/scripts/test-detect-ci-paths.sh

      - name: Detect changed paths
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/detect-ci-paths.sh

  base-image-update-report-test:
    name: Base Image Update Report Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run tests
        run: node --test .github/scripts/base-image-update-report.test.mjs

  node-lts-ignore-expiry:
    name: Node LTS Ignore Expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check Node LTS ignore expiry
        run: tools/ci/check-node-lts-ignore-expiry.sh

  documentation-references:
    name: Documentation References
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check repository-relative documentation links
        run: python3 .github/scripts/check-doc-references.py

  check-i18n-generate:
    name: Generated Files Up-to-Date
    needs: changes
    if: ${{ needs.changes.outputs.system == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: system
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: system/go.mod
          cache: true
          cache-dependency-path: |
            system/go.sum
            system/go.mod

      - name: Download deps
        run: go mod download

      - name: Run go generate
        run: go generate ./...
        env:
          I18N_BASELINE: ja

      - name: Verify no diff
        working-directory: ${{ github.workspace }}
        run: |
          git update-index -q --refresh
          if ! git diff --quiet --exit-code; then
            echo "::error::Generated files are outdated. Please run 'go generate ./...' and commit the changes."
            git diff --name-only
            exit 1
          fi

  go-lint:
    name: Go Lint
    needs: changes
    if: ${{ needs.changes.outputs.system == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: system/go.mod
          cache: true
          cache-dependency-path: |
            system/go.sum
            system/go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: system
          args: --timeout=5m --config=.golangci.yml

  system-go-test:
    name: System Go Test
    needs: changes
    if: ${{ needs.changes.outputs.system == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: system
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: system/go.mod
          cache: true
          cache-dependency-path: |
            system/go.sum
            system/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -shuffle=on -v ./...

  system-firestore-emulator-test:
    name: System Firestore Emulator Test
    needs: changes
    if: ${{ needs.changes.outputs.firestore_integration == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: system/go.mod
          cache: true
          cache-dependency-path: |
            system/go.sum
            system/go.mod

      - name: Download Go dependencies
        working-directory: system
        run: go mod download

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.25.1

      - name: Cache Firestore Emulator
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firestore-emulator-firebase-tools-15.25.1

      - name: Run Firestore Emulator integration tests
        run: bash .github/scripts/run-firestore-integration-tests.sh

  formal-spec:
    name: Formal Spec (FSL)
    needs: changes
    if: ${{ needs.changes.outputs.formal_spec == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pinned FSL tool
        uses: actions/cache@v6
        with:
          path: formal-spec/fsl/.tools
          key: ${{ runner.os }}-fsl-${{ hashFiles('formal-spec/fsl/VERSION', 'formal-spec/fsl/SHA256SUMS') }}

      - name: Verify formal specifications
        run: bash .github/scripts/run-formal-spec-tests.sh

  room-image-prompt-go-lint:
    name: Room Image Prompt Go Lint
    needs: changes
    if: ${{ needs.changes.outputs.room_image_prompt == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/room-image-prompt/go.mod
          cache: true
          cache-dependency-path: tools/room-image-prompt/go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: tools/room-image-prompt
          args: --timeout=5m --config=.golangci.yml

  room-image-prompt-go-test:
    name: Room Image Prompt Go Test
    needs: changes
    if: ${{ needs.changes.outputs.room_image_prompt == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/room-image-prompt
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/room-image-prompt/go.mod
          cache: true
          cache-dependency-path: tools/room-image-prompt/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -shuffle=on -v ./...

      - name: Build CLI
        run: go build -o /dev/null ./cmd/room-image-prompt

  menu-image-generator-lint-build:
    name: Menu Image Generator Lint & Build
    needs: changes
    if: ${{ needs.changes.outputs.menu_image_generator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/menu-image-generator
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: tools/menu-image-generator/package.json
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: tools/menu-image-generator/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # 依存関係インストール時（lint/build 用）はブラウザ不要のため Chromium ダウンロードをスキップ（タイムアウト防止）
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
          PUPPETEER_SKIP_DOWNLOAD: 1
      - name: Run lint
        run: pnpm lint
      - name: Run build
        run: pnpm build

  video-maker-simulator-check:
    name: Video Maker Simulator Lint, Typecheck & Build
    needs: changes
    if: ${{ needs.changes.outputs.video_maker_simulator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/video-maker/1000-minutes-simulator
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: tools/video-maker/1000-minutes-simulator/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run build
        run: pnpm build

  figma-plugin-room-layout-analyzer-build:
    name: Figma Room Layout Analyzer Build
    needs: changes
    if: ${{ needs.changes.outputs.figma_plugin == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/figma-plugin/room-layout-analyzer
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: tools/figma-plugin/room-layout-analyzer/package.json
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: tools/figma-plugin/room-layout-analyzer/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm build

  biome-lint:
    name: Biome Lint (youtube-monitor)
    needs: changes
    if: ${{ needs.changes.outputs.youtube_monitor == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: youtube-monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: youtube-monitor/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: youtube-monitor/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check
        run: pnpm exec biome check . --reporter=github

  youtube-monitor-test:
    name: YouTube Monitor Test
    needs: changes
    if: ${{ needs.changes.outputs.youtube_monitor == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: youtube-monitor
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: youtube-monitor/package.json
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: youtube-monitor/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  youtube-monitor-build:
    name: YouTube Monitor Build
    needs: changes
    if: ${{ needs.changes.outputs.youtube_monitor == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: youtube-monitor
    env:
      NEXT_PUBLIC_DEBUG: "false"
      NEXT_PUBLIC_CHANNEL_GL: "false"
      NEXT_PUBLIC_ROOM_CONFIG: "DEV"
      NEXT_PUBLIC_API_ENDPOINT: "http://localhost:3000"
      NEXT_PUBLIC_API_KEY: "ci-dummy-api-key"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ci-dummy-project"
      NEXT_PUBLIC_FIREBASE_API_KEY: "ci-dummy-firebase-api-key"
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: youtube-monitor/package.json
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: youtube-monitor/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm build:ci

  docs-site-check:
    name: Docs Site Lint & Typecheck
    needs: changes
    if: ${{ needs.changes.outputs.docs_site == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs-site/package.json
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck

  docs-site-build:
    name: Docs Site Build
    needs: changes
    if: ${{ needs.changes.outputs.docs_site == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs-site/package.json
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm build

  aws-cdk-test:
    name: AWS CDK Test
    needs: changes
    if: ${{ needs.changes.outputs.aws_cdk == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: aws-cdk
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: aws-cdk/package.json
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: aws-cdk/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Run CDK synth
        run: pnpm cdk:synth


  gcp-terraform-validate:
    name: GCP Terraform Validate
    needs: changes
    if: ${{ needs.changes.outputs.gcp_terraform == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test authenticated Terraform CI guardrails
        run: |
          python3 .github/scripts/test_terraform_plan_summary.py
          python3 .github/scripts/test_terraform_authenticated_workflow.py
          python3 .github/scripts/test_terraform_identity_smoke.py
          python3 .github/scripts/test_terraform_history_plan_receipt.py
          python3 .github/scripts/test_terraform_history_import_verifier.py
          python3 .github/scripts/test_terraform_email_adoption_gate.py
          python3 .github/scripts/test_terraform_protected_plan.py
          python3 .github/scripts/test_terraform_quota_create_gate.py
          python3 .github/scripts/test_terraform_quota_refresh_gate.py
          python3 .github/scripts/test_terraform_export_topic_gate.py
          python3 .github/scripts/test_terraform_export_scheduler_gate.py
          python3 .github/scripts/test_terraform_export_function_gate.py
          python3 .github/scripts/test_gcp_user_activity_schema_audit_workflow.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra/gcp

      - name: Initialize and validate roots
        run: |
          set -euo pipefail
          for env in dev prod; do
            terraform -chdir="infra/gcp/environments/$env" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/gcp/environments/$env" validate
          done

      - name: Test quota alert mock plans and import-only boundary
        run: |
          python3 .github/scripts/test_youtube_quota_alerts.py
          python3 .github/scripts/test_backup_bucket.py
          python3 .github/scripts/test_export_topic.py
          python3 .github/scripts/test_export_scheduler.py
          python3 .github/scripts/test_export_function.py
          python3 .github/scripts/test_notification_channels.py
          python3 .github/scripts/test_user_activity_history.py

      - name: Verify multi-platform provider locks are complete
        run: |
          set -euo pipefail
          for env in dev prod; do
            terraform -chdir="infra/gcp/environments/$env" providers lock \
              -platform=linux_amd64 \
              -platform=darwin_arm64
          done

          git diff --exit-code -- \
            infra/gcp/environments/dev/.terraform.lock.hcl \
            infra/gcp/environments/prod/.terraform.lock.hcl

      - name: Verify provider locks match
        run: cmp infra/gcp/environments/dev/.terraform.lock.hcl infra/gcp/environments/prod/.terraform.lock.hcl

  gcp-terraform-authenticated:
    name: GCP Terraform Authenticated
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.terraform_authenticated == true }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-terraform-authenticated.yml
    secrets:
      AWS_TERRAFORM_BACKEND_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ARN }}
      AWS_TERRAFORM_BACKEND_ROLE_ID: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ID }}
      AWS_TERRAFORM_STATE_BUCKET: ${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}
      AWS_TERRAFORM_STATE_ACCOUNT_ID: ${{ secrets.AWS_TERRAFORM_STATE_ACCOUNT_ID }}
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      GCP_MONITORING_PRIMARY_EMAIL: ${{ secrets.GCP_MONITORING_PRIMARY_EMAIL }}
      GCP_MONITORING_PRIMARY_EMAIL_CHANNEL: ${{ secrets.GCP_MONITORING_PRIMARY_EMAIL_CHANNEL }}
    with:
      target: ${{ inputs.terraform_target }}
      mode: ${{ inputs.terraform_mode }}
      plan_cost_evidence: ${{ inputs.terraform_plan_cost_evidence }}
      history_import_approval: ${{ inputs.terraform_history_import_approval }}

  gcp-user-activity-schema-audit:
    name: GCP User Activity Schema Audit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gcp_user_activity_schema_audit == true }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-user-activity-schema-audit.yml
    secrets:
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT: ${{ secrets.GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT }}
    with:
      target: dev

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - base-image-update-report-test
      - node-lts-ignore-expiry
      - documentation-references
      - check-i18n-generate
      - go-lint
      - system-go-test
      - system-firestore-emulator-test
      - formal-spec
      - room-image-prompt-go-lint
      - room-image-prompt-go-test
      - menu-image-generator-lint-build
      - video-maker-simulator-check
      - figma-plugin-room-layout-analyzer-build
      - biome-lint
      - youtube-monitor-test
      - youtube-monitor-build
      - docs-site-check
      - docs-site-build
      - aws-cdk-test
      - gcp-terraform-validate
      - gcp-user-activity-schema-audit
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a CI job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more CI jobs failed or were cancelled."
          exit 1
      - name: Pass when all selected jobs succeeded or were skipped
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All selected CI jobs passed; skipped jobs are treated as successful."
