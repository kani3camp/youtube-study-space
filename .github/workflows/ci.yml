name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 実行内容（plan/apply時の検査はTerraform関連＋Repository共通）
        required: false
        default: 全検査のみ
        type: choice
        options:
          - 全検査のみ
          - 検査+plan
          - 検査+apply
      terraform_target:
        description: Terraform target environment
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod
      terraform_expected_sha:
        description: DEVの対象SHA（省略可）、PRODの実行元SHA（必須）
        required: false
        type: string
      terraform_source_branch:
        description: DEVの対象ブランチ（SHAのみも可。両方空欄は実行元自身）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.execution_mode == '検査+plan' || inputs.execution_mode == '検査+apply')) }}

jobs:
  changes:
    name: Detect CI Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      system: ${{ steps.detect.outputs.system }}
      room_image_prompt: ${{ steps.detect.outputs.room_image_prompt }}
      menu_image_generator: ${{ steps.detect.outputs.menu_image_generator }}
      video_maker_simulator: ${{ steps.detect.outputs.video_maker_simulator }}
      figma_plugin: ${{ steps.detect.outputs.figma_plugin }}
      youtube_monitor: ${{ steps.detect.outputs.youtube_monitor }}
      docs_site: ${{ steps.detect.outputs.docs_site }}
      aws_cdk: ${{ steps.detect.outputs.aws_cdk }}
      gcp_terraform: ${{ steps.detect.outputs.gcp_terraform }}
      node_projects: ${{ steps.detect.outputs.node_projects }}
      firestore_integration: ${{ steps.detect.outputs.firestore_integration }}
      formal_spec: ${{ steps.detect.outputs.formal_spec }}
      all: ${{ steps.detect.outputs.all }}
      validation_sha: ${{ steps.source.outputs.validation_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the validation and Terraform source commit
        id: source
        env:
          CI_EXECUTION_MODE: ${{ inputs.execution_mode }}
          NORMAL_TARGET: ${{ inputs.terraform_target }}
          NORMAL_MODE: ${{ inputs.execution_mode == '検査+apply' && 'normal-apply' || 'normal-plan' }}
          NORMAL_EXPECTED_SHA: ${{ inputs.terraform_expected_sha }}
          NORMAL_SOURCE_BRANCH: ${{ inputs.terraform_source_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-terraform-source.py

      - name: Test CI path detector
        run: bash .github/scripts/test-detect-ci-paths.sh

      - name: Detect changed paths
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_AUTHENTICATED_TERRAFORM_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && (inputs.execution_mode == '検査+plan' || inputs.execution_mode == '検査+apply') }}
        run: bash .github/scripts/detect-ci-paths.sh

  system:
    name: System
    needs: changes
    if: ${{ needs.changes.outputs.system == 'true' || needs.changes.outputs.all == 'true' || needs.changes.outputs.firestore_integration == 'true' }}
    uses: ./.github/workflows/ci-system.yml
    with:
      system: ${{ needs.changes.outputs.system == 'true' || needs.changes.outputs.all == 'true' }}
      firestore_integration: ${{ needs.changes.outputs.firestore_integration == 'true' || needs.changes.outputs.all == 'true' }}

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.youtube_monitor == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' || needs.changes.outputs.docs_site == 'true' }}
    uses: ./.github/workflows/ci-frontend.yml
    with:
      youtube_monitor: ${{ needs.changes.outputs.youtube_monitor == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
      docs_site: ${{ needs.changes.outputs.docs_site == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}

  tools:
    name: Tools
    needs: changes
    if: ${{ needs.changes.outputs.formal_spec == 'true' || needs.changes.outputs.all == 'true' || needs.changes.outputs.room_image_prompt == 'true' || needs.changes.outputs.menu_image_generator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.video_maker_simulator == 'true' || needs.changes.outputs.figma_plugin == 'true' }}
    uses: ./.github/workflows/ci-tools.yml
    with:
      formal_spec: ${{ needs.changes.outputs.formal_spec == 'true' || needs.changes.outputs.all == 'true' }}
      room_image_prompt: ${{ needs.changes.outputs.room_image_prompt == 'true' || needs.changes.outputs.all == 'true' }}
      menu_image_generator: ${{ needs.changes.outputs.menu_image_generator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
      video_maker_simulator: ${{ needs.changes.outputs.video_maker_simulator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
      figma_plugin: ${{ needs.changes.outputs.figma_plugin == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}

  infra:
    name: Infra
    needs: changes
    if: ${{ needs.changes.outputs.aws_cdk == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    uses: ./.github/workflows/ci-infra.yml

  repository:
    name: Repository
    needs: changes
    uses: ./.github/workflows/ci-repository.yml
    with:
      source_sha: ${{ needs.changes.outputs.validation_sha }}

  gcp-terraform-validate:
    name: GCP Terraform Validate
    needs: changes
    if: ${{ needs.changes.outputs.gcp_terraform == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted validation controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare isolated validation tools
        uses: ./.github/actions/prepare-ci-validation
      - name: Checkout exact validation source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.validation_sha }}
          path: .ci-source
          persist-credentials: false
      - name: Run isolated validation
        env:
          VALIDATION_SHA: ${{ needs.changes.outputs.validation_sha }}
        run: |
          # Do not expose runner tokens, command files or the Docker socket to target code.
          marker="$(openssl rand -hex 32)"
          echo "::stop-commands::${marker}"
          set +e
          docker run --rm --init --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=256 --memory=6g --cpus=2 \
            --tmpfs /tmp:rw,exec,mode=1777 \
            --tmpfs /work:rw,exec,uid=10001,gid=10001,mode=0700 \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/.ci-source,dst=/source,readonly" \
            --env "CI_SOURCE_SHA=${VALIDATION_SHA}" \
            yss-ci-validation:local terraform
          result=$?
          echo "::${marker}::"
          exit "$result"

  gcp-terraform-authenticated:
    name: GCP Terraform Authenticated
    needs: [changes, ci-gate]
    if: ${{ !cancelled() && needs.ci-gate.result == 'success' && github.event_name == 'workflow_dispatch' && (inputs.execution_mode == '検査+plan' || inputs.execution_mode == '検査+apply') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-terraform-authenticated.yml
    secrets:
      GCP_TERRAFORM_NORMAL_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_NORMAL_WIF_PROVIDER }}
      GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT }}
      AWS_TERRAFORM_BACKEND_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ARN }}
      AWS_TERRAFORM_BACKEND_ROLE_ID: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ID }}
      AWS_TERRAFORM_STATE_BUCKET: ${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}
      AWS_TERRAFORM_STATE_ACCOUNT_ID: ${{ secrets.AWS_TERRAFORM_STATE_ACCOUNT_ID }}
      GCP_TERRAFORM_MANAGED_INPUTS_JSON: ${{ secrets.GCP_TERRAFORM_MANAGED_INPUTS_JSON }}
    with:
      target: ${{ inputs.terraform_target }}
      mode: ${{ inputs.execution_mode == '検査+apply' && 'normal-apply' || 'normal-plan' }}
      # Use the checked commit, never resolve a moving branch again after CI.
      expected_sha: ${{ needs.changes.outputs.validation_sha }}
      source_branch: ''

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - system
      - frontend
      - tools
      - infra
      - repository
      - gcp-terraform-validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful selected validations
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check-ci-results.py
