name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      terraform_authenticated:
        description: Authenticated Terraform
        required: false
        default: false
        type: boolean
      terraform_target:
        description: Terraform target environment
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod
      terraform_mode:
        description: Terraform operation
        required: false
        default: migration-plan
        type: choice
        options:
          - migration-plan
          - migration-apply
          - normal-plan
          - normal-apply
          - normal-e2e
      terraform_expected_sha:
        description: Reviewed dev SHA for normal operations
        required: false
        type: string
      gcp_user_activity_schema_audit:
        description: Run the fail-closed development user-activity schema audit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.terraform_authenticated == true) }}

jobs:
  changes:
    name: Detect CI Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      system: ${{ steps.detect.outputs.system }}
      room_image_prompt: ${{ steps.detect.outputs.room_image_prompt }}
      menu_image_generator: ${{ steps.detect.outputs.menu_image_generator }}
      video_maker_simulator: ${{ steps.detect.outputs.video_maker_simulator }}
      figma_plugin: ${{ steps.detect.outputs.figma_plugin }}
      youtube_monitor: ${{ steps.detect.outputs.youtube_monitor }}
      docs_site: ${{ steps.detect.outputs.docs_site }}
      aws_cdk: ${{ steps.detect.outputs.aws_cdk }}
      gcp_terraform: ${{ steps.detect.outputs.gcp_terraform }}
      node_projects: ${{ steps.detect.outputs.node_projects }}
      firestore_integration: ${{ steps.detect.outputs.firestore_integration }}
      formal_spec: ${{ steps.detect.outputs.formal_spec }}
      all: ${{ steps.detect.outputs.all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test CI path detector
        run: bash .github/scripts/test-detect-ci-paths.sh

      - name: Detect changed paths
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_AUTHENTICATED_TERRAFORM_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.terraform_authenticated == true }}
        run: bash .github/scripts/detect-ci-paths.sh

  system:
    name: System
    needs: changes
    if: ${{ needs.changes.outputs.system == 'true' || needs.changes.outputs.all == 'true' || needs.changes.outputs.firestore_integration == 'true' }}
    uses: ./.github/workflows/ci-system.yml
    with:
      system: ${{ needs.changes.outputs.system == 'true' || needs.changes.outputs.all == 'true' }}
      firestore_integration: ${{ needs.changes.outputs.firestore_integration == 'true' || needs.changes.outputs.all == 'true' }}

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.youtube_monitor == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' || needs.changes.outputs.docs_site == 'true' }}
    uses: ./.github/workflows/ci-frontend.yml
    with:
      youtube_monitor: ${{ needs.changes.outputs.youtube_monitor == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
      docs_site: ${{ needs.changes.outputs.docs_site == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}

  tools:
    name: Tools
    needs: changes
    if: ${{ needs.changes.outputs.formal_spec == 'true' || needs.changes.outputs.all == 'true' || needs.changes.outputs.room_image_prompt == 'true' || needs.changes.outputs.menu_image_generator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.video_maker_simulator == 'true' || needs.changes.outputs.figma_plugin == 'true' }}
    uses: ./.github/workflows/ci-tools.yml
    with:
      formal_spec: ${{ needs.changes.outputs.formal_spec == 'true' || needs.changes.outputs.all == 'true' }}
      room_image_prompt: ${{ needs.changes.outputs.room_image_prompt == 'true' || needs.changes.outputs.all == 'true' }}
      menu_image_generator: ${{ needs.changes.outputs.menu_image_generator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
      video_maker_simulator: ${{ needs.changes.outputs.video_maker_simulator == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
      figma_plugin: ${{ needs.changes.outputs.figma_plugin == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}

  infra:
    name: Infra
    needs: changes
    if: ${{ needs.changes.outputs.aws_cdk == 'true' || needs.changes.outputs.node_projects == 'true' || needs.changes.outputs.all == 'true' }}
    uses: ./.github/workflows/ci-infra.yml

  repository:
    name: Repository
    uses: ./.github/workflows/ci-repository.yml

  gcp-terraform-validate:
    name: GCP Terraform Validate
    needs: changes
    if: ${{ needs.changes.outputs.gcp_terraform == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python for GCP contract tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Test authenticated Terraform CI guardrails
        run: |
          python3 .github/scripts/test_terraform_native_runner.py
          python3 .github/scripts/test_terraform_plan_summary.py
          python3 .github/scripts/test_terraform_migration_contract.py
          python3 .github/scripts/test_terraform_migration.py
          python3 .github/scripts/test_production_initializer_controller.py
          python3 .github/scripts/test_terraform_authenticated_workflow.py
          python3 .github/scripts/test_terraform_identity_smoke.py
          python3 .github/scripts/test_terraform_email_adoption_gate.py
          python3 .github/scripts/test_terraform_protected_plan.py
          python3 .github/scripts/test_terraform_plan_diagnostic.py
          python3 .github/scripts/test_terraform_baseline_drift_diagnostic.py
          python3 infra/gcp/tests/test_runtime_plan_contract.py
          python3 -B infra/gcp/tests/test_terraform_normal_change_contract.py
          python3 -B infra/gcp/tests/test_terraform_normal_ops.py
          python3 .github/scripts/test_terraform_quota_create_gate.py
          python3 .github/scripts/test_terraform_quota_refresh_gate.py
          python3 .github/scripts/test_terraform_export_topic_gate.py
          python3 .github/scripts/test_terraform_export_scheduler_gate.py
          python3 .github/scripts/test_terraform_export_function_gate.py
          python3 .github/scripts/test_gcp_user_activity_schema_audit_workflow.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra/gcp

      - name: Test pure production initializer with pinned local Terraform
        run: python3 .github/scripts/test_production_initializer.py

      - name: Initialize and validate roots
        run: |
          set -euo pipefail
          for env in dev prod; do
            terraform -chdir="infra/gcp/environments/$env" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/gcp/environments/$env" validate
          done

      - name: Test output-only initialization with native S3 locking
        run: python3 .github/scripts/test_production_initializer_s3.py

      - name: Test Pool import fidelity with credentialless mocks
        run: python3 -B infra/gcp/tests/test_runtime_pool_import_fidelity.py

      - name: Test quota alert mock plans and import-only boundary
        run: python3 -B .github/scripts/run_terraform_native_tests.py --workers 2

      - name: Test Terraform create/update/delete/replace
        run: python3 -B infra/gcp/tests/test_terraform_normal_ops_native.py

      - name: Verify multi-platform provider locks are complete
        run: |
          set -euo pipefail
          for env in dev prod; do
            terraform -chdir="infra/gcp/environments/$env" providers lock \
              -platform=linux_amd64 \
              -platform=darwin_arm64
          done

          git diff --exit-code -- \
            infra/gcp/environments/dev/.terraform.lock.hcl \
            infra/gcp/environments/prod/.terraform.lock.hcl

      - name: Verify provider locks match
        run: cmp infra/gcp/environments/dev/.terraform.lock.hcl infra/gcp/environments/prod/.terraform.lock.hcl

  gcp-terraform-authenticated:
    name: GCP Terraform Authenticated
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.terraform_authenticated == true }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-terraform-authenticated.yml
    secrets:
      GCP_TERRAFORM_NORMAL_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_NORMAL_WIF_PROVIDER }}
      GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT }}
      AWS_TERRAFORM_BACKEND_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ARN }}
      AWS_TERRAFORM_BACKEND_ROLE_ID: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ID }}
      AWS_TERRAFORM_STATE_BUCKET: ${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}
      AWS_TERRAFORM_STATE_ACCOUNT_ID: ${{ secrets.AWS_TERRAFORM_STATE_ACCOUNT_ID }}
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      GCP_TERRAFORM_MANAGED_INPUTS_JSON: ${{ secrets.GCP_TERRAFORM_MANAGED_INPUTS_JSON }}
    with:
      target: ${{ inputs.terraform_target }}
      mode: ${{ inputs.terraform_mode }}
      expected_sha: ${{ inputs.terraform_expected_sha }}

  gcp-user-activity-schema-audit:
    name: GCP User Activity Schema Audit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gcp_user_activity_schema_audit == true }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-user-activity-schema-audit.yml
    secrets:
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT: ${{ secrets.GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT }}
    with:
      target: dev

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - system
      - frontend
      - tools
      - infra
      - repository
      - gcp-terraform-validate
      - gcp-user-activity-schema-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require successful selected validations
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_SCHEMA_AUDIT_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.gcp_user_activity_schema_audit == true }}
        run: python3 .github/scripts/check-ci-results.py
