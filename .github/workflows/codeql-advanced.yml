# Same-tree CodeQL analysis uses a fixed secretless Environment in the callee.
name: CodeQL Advanced

on:
  push:
    branches:
      - dev
      - main
      - feature/gcp-terraform-iac
      - integration/mypage-canon-20261006
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# No workflow-wide grant. Analysis permissions remain bounded to the job.
permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    uses: ./.github/workflows/codeql-analyzer.yml
    permissions:
      contents: read
      security-events: write
      id-token: none
