name: Set Maintenance Mode

# Turns MyPage planned maintenance on or off by executing the fixed Cloud Run
# Job. The credentialed job lives in mypage-maintenance-authenticated.yml.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [development, production]
      enabled:
        description: Enable or disable planned maintenance
        required: true
        type: choice
        options: ['true', 'false']

permissions: {}
concurrency:
  group: mypage-maintenance-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  transition:
    name: Set Maintenance Mode
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-maintenance-authenticated.yml
    with:
      environment: ${{ inputs.environment }}
      enabled: ${{ inputs.enabled }}
    secrets:
      MYPAGE_MAINTENANCE_WIF_PROVIDER: ${{ secrets.MYPAGE_MAINTENANCE_WIF_PROVIDER }}
