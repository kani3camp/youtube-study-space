name: Set Maintenance Mode
run-name: Maintenance ${{ inputs.environment }} / enabled=${{ inputs.enabled }}

# Turns MyPage planned maintenance on or off by executing the fixed Cloud Run
# Job. The credentialed job lives in mypage-maintenance-authenticated.yml.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [development, production]
      enabled:
        description: Enable or disable planned maintenance
        required: true
        type: choice
        options: ['true', 'false']

permissions: {}
concurrency:
  group: mypage-maintenance-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Credentialless record of the selection. It neither gates the transition nor
  # changes the run conclusion when the record itself fails.
  record:
    name: Record Dispatch Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions: {}
    steps:
      - name: Record dispatch inputs
        env:
          DISPATCH_INPUTS: environment enabled
          DISPATCH_VALUE_ENVIRONMENT: ${{ inputs.environment }}
          DISPATCH_VALUE_ENABLED: ${{ inputs.enabled }}
        # Records only the inputs listed in DISPATCH_INPUTS, before any credential.
        # Values arrive through env only and are escaped for a Markdown table.
        # continue-on-error: recording never changes whether the run proceeds.
        continue-on-error: true
        run: |
          python3 -I - <<'PY'
          import os
          import re
          import unicodedata

          VISIBLE = {'\n': 'n', '\r': 'r', '\t': 't'}

          def cell(value):
              if value is None:
                  return '（定義なし）'
              if value == '':
                  return '（空文字）'
              out = []
              for char in value:
                  if char in VISIBLE:
                      out.append('&#92;' + VISIBLE[char])
                  elif unicodedata.category(char) in ('Cc', 'Cf', 'Cs', 'Co', 'Cn', 'Zl', 'Zp'):
                      out.append('&#92;u{%04x}' % ord(char))
                  elif char.isascii() and not char.isalnum() and char != ' ':
                      out.append('&#%d;' % ord(char))
                  else:
                      out.append(char)
              return '<code>' + ''.join(out) + '</code>'

          names = os.environ['DISPATCH_INPUTS'].split()
          lines = ['## 手動実行の入力値', '', '| 入力 | 値 | 既定値 |', '| --- | --- | --- |']
          for name in names:
              if not re.fullmatch(r'[a-z][a-z0-9_]*', name):
                  raise SystemExit('Unsupported input name: ' + name)
              key = name.upper()
              value = os.environ['DISPATCH_VALUE_' + key]
              lines.append('| `%s` | %s | %s |' % (name, cell(value), cell(os.environ.get('DISPATCH_DEFAULT_' + key))))
          lines += ['', '実行コンテキスト（選択入力ではありません）', '', '| 項目 | 値 |', '| --- | --- |']
          for name in ('event_name', 'ref', 'sha', 'actor', 'triggering_actor', 'run_attempt'):
              lines.append('| `%s` | %s |' % (name, cell(os.environ.get('GITHUB_' + name.upper(), ''))))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n\n')
          PY

  transition:
    name: Set Maintenance Mode
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-maintenance-authenticated.yml
    with:
      environment: ${{ inputs.environment }}
      enabled: ${{ inputs.enabled }}
    secrets:
      MYPAGE_MAINTENANCE_WIF_PROVIDER: ${{ secrets.MYPAGE_MAINTENANCE_WIF_PROVIDER }}
