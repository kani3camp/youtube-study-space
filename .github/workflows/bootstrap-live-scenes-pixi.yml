name: Bootstrap PixiJS Dependency

on:
  push:
    branches:
      - feature/live-room-scenes-pr3-pixi-runtime

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/live-room-scenes-pr3-pixi-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: youtube-monitor/pnpm-lock.yaml
      - name: Add PixiJS
        working-directory: youtube-monitor
        run: pnpm add 'pixi.js@^8.20.1' --lockfile-only
      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-monitor/package.json youtube-monitor/pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PixiJS依存とlockfileを追加"
          git push origin HEAD:feature/live-room-scenes-pr3-pixi-runtime
