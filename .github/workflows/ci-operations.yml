name: CI Operations

on:
  workflow_call:
    inputs:
      terraform_authenticated:
        required: true
        type: boolean
      terraform_target:
        required: true
        type: string
      terraform_mode:
        required: true
        type: string
      terraform_expected_sha:
        required: false
        type: string
      gcp_user_activity_schema_audit:
        required: true
        type: boolean
      mypage_foundation:
        required: true
        type: boolean
      mypage_foundation_target:
        required: true
        type: string
      mypage_foundation_mode:
        required: true
        type: string
      mypage_foundation_expected_sha:
        required: false
        type: string
      mypage_hosting:
        required: true
        type: boolean
      mypage_hosting_expected_sha:
        required: false
        type: string
      mypage_backend:
        required: true
        type: boolean
      mypage_backend_expected_sha:
        required: false
        type: string
      repository_result:
        required: true
        type: string
      frontend_result:
        required: true
        type: string
      system_result:
        required: true
        type: string
      gcp_terraform_validate_result:
        required: true
        type: string
    secrets:
      GCP_TERRAFORM_NORMAL_WIF_PROVIDER:
        required: false
      GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT:
        required: false
      AWS_TERRAFORM_BACKEND_ROLE_ARN:
        required: false
      AWS_TERRAFORM_BACKEND_ROLE_ID:
        required: false
      AWS_TERRAFORM_STATE_BUCKET:
        required: false
      AWS_TERRAFORM_STATE_ACCOUNT_ID:
        required: false
      GCP_TERRAFORM_WIF_PROVIDER:
        required: false
      GCP_TERRAFORM_SERVICE_ACCOUNT:
        required: false
      GCP_TERRAFORM_MANAGED_INPUTS_JSON:
        required: false
      GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT:
        required: false
      MYPAGE_STATE_BUCKET:
        required: false
      MYPAGE_STATE_ACCOUNT:
        required: false
      MYPAGE_BACKEND_ROLE_ARN:
        required: false
      MYPAGE_BACKEND_ROLE_ID:
        required: false
      MYPAGE_GCP_WIF_PROVIDER:
        required: false
      MYPAGE_GCP_SERVICE_ACCOUNT:
        required: false
      MYPAGE_PLAN_HMAC_KEY:
        required: false
      MYPAGE_RUNTIME_SETTINGS_JSON:
        required: false

permissions:
  contents: read

jobs:
  validate-selection:
    name: Validate Operation Selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_AUTHENTICATED: ${{ inputs.terraform_authenticated }}
      SCHEMA_AUDIT: ${{ inputs.gcp_user_activity_schema_audit }}
      MYPAGE_FOUNDATION: ${{ inputs.mypage_foundation }}
      MYPAGE_HOSTING: ${{ inputs.mypage_hosting }}
      MYPAGE_BACKEND: ${{ inputs.mypage_backend }}
      REPOSITORY_RESULT: ${{ inputs.repository_result }}
      FRONTEND_RESULT: ${{ inputs.frontend_result }}
      SYSTEM_RESULT: ${{ inputs.system_result }}
      GCP_TERRAFORM_VALIDATE_RESULT: ${{ inputs.gcp_terraform_validate_result }}
    steps:
      - name: Require exactly one operation and its validation prerequisites
        run: |
          set -euo pipefail

          selected=0
          for value in "$TERRAFORM_AUTHENTICATED" "$SCHEMA_AUDIT" "$MYPAGE_FOUNDATION" "$MYPAGE_HOSTING" "$MYPAGE_BACKEND"; do
            if [[ "$value" == "true" ]]; then
              selected=$((selected + 1))
            elif [[ "$value" != "false" ]]; then
              echo "::error::Operation toggles must be explicit booleans"
              exit 1
            fi
          done

          if [[ "$selected" -ne 1 ]]; then
            echo "::error::Select exactly one authenticated operation"
            exit 1
          fi

          if [[ "$REPOSITORY_RESULT" != "success" ]]; then
            echo "::error::Repository validation must succeed before an authenticated operation"
            exit 1
          fi

          if [[ "$TERRAFORM_AUTHENTICATED" == "true" || "$SCHEMA_AUDIT" == "true" || "$MYPAGE_FOUNDATION" == "true" ]]; then
            if [[ "$GCP_TERRAFORM_VALIDATE_RESULT" != "success" ]]; then
              echo "::error::GCP Terraform validation must succeed before this operation"
              exit 1
            fi
          fi

          if [[ "$MYPAGE_HOSTING" == "true" && "$FRONTEND_RESULT" != "success" ]]; then
            echo "::error::Frontend validation must succeed before Hosting release"
            exit 1
          fi

          if [[ "$MYPAGE_BACKEND" == "true" && "$SYSTEM_RESULT" != "success" ]]; then
            echo "::error::System validation must succeed before Backend release"
            exit 1
          fi

  gcp-terraform-authenticated:
    name: GCP Terraform Authenticated
    needs: validate-selection
    if: ${{ inputs.terraform_authenticated }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-terraform-authenticated.yml
    secrets:
      GCP_TERRAFORM_NORMAL_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_NORMAL_WIF_PROVIDER }}
      GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT }}
      AWS_TERRAFORM_BACKEND_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ARN }}
      AWS_TERRAFORM_BACKEND_ROLE_ID: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ID }}
      AWS_TERRAFORM_STATE_BUCKET: ${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}
      AWS_TERRAFORM_STATE_ACCOUNT_ID: ${{ secrets.AWS_TERRAFORM_STATE_ACCOUNT_ID }}
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      GCP_TERRAFORM_MANAGED_INPUTS_JSON: ${{ secrets.GCP_TERRAFORM_MANAGED_INPUTS_JSON }}
    with:
      target: ${{ inputs.terraform_target }}
      mode: ${{ inputs.terraform_mode }}
      expected_sha: ${{ inputs.terraform_expected_sha }}

  gcp-user-activity-schema-audit:
    name: GCP User Activity Schema Audit
    needs: validate-selection
    if: ${{ inputs.gcp_user_activity_schema_audit }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-user-activity-schema-audit.yml
    secrets:
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT: ${{ secrets.GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT }}
    with:
      target: dev

  mypage-foundation-authenticated:
    name: MyPage Foundation Authenticated
    needs: validate-selection
    if: ${{ inputs.mypage_foundation }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-foundation-authenticated.yml
    secrets:
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      MYPAGE_RUNTIME_SETTINGS_JSON: ${{ secrets.MYPAGE_RUNTIME_SETTINGS_JSON }}
    with:
      target: ${{ inputs.mypage_foundation_target }}
      mode: ${{ inputs.mypage_foundation_mode }}
      expected_sha: ${{ inputs.mypage_foundation_expected_sha }}

  mypage-hosting-authenticated:
    name: MyPage DEV Hosting Release
    needs: validate-selection
    if: ${{ inputs.mypage_hosting }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-hosting-authenticated.yml
    with:
      expected_sha: ${{ inputs.mypage_hosting_expected_sha }}
      other_operation: false

  mypage-backend-authenticated:
    name: MyPage DEV Backend Release
    needs: validate-selection
    if: ${{ inputs.mypage_backend }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-backend-authenticated.yml
    with:
      expected_sha: ${{ inputs.mypage_backend_expected_sha }}
      other_operation: false
    secrets:
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      MYPAGE_RUNTIME_SETTINGS_JSON: ${{ secrets.MYPAGE_RUNTIME_SETTINGS_JSON }}
