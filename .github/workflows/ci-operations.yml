name: CI Operations

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      environment:
        required: true
        type: string
      repository_result:
        required: true
        type: string
      frontend_result:
        required: true
        type: string
      system_result:
        required: true
        type: string
      tools_result:
        required: true
        type: string
      infra_result:
        required: true
        type: string
      gcp_terraform_validate_result:
        required: true
        type: string
    secrets:
      GCP_TERRAFORM_NORMAL_WIF_PROVIDER:
        required: false
      GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT:
        required: false
      AWS_TERRAFORM_BACKEND_ROLE_ARN:
        required: false
      AWS_TERRAFORM_BACKEND_ROLE_ID:
        required: false
      AWS_TERRAFORM_STATE_BUCKET:
        required: false
      AWS_TERRAFORM_STATE_ACCOUNT_ID:
        required: false
      GCP_TERRAFORM_WIF_PROVIDER:
        required: false
      GCP_TERRAFORM_SERVICE_ACCOUNT:
        required: false
      GCP_TERRAFORM_MANAGED_INPUTS_JSON:
        required: false
      GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT:
        required: false
      MYPAGE_STATE_BUCKET:
        required: false
      MYPAGE_STATE_ACCOUNT:
        required: false
      MYPAGE_BACKEND_ROLE_ARN:
        required: false
      MYPAGE_BACKEND_ROLE_ID:
        required: false
      MYPAGE_GCP_WIF_PROVIDER:
        required: false
      MYPAGE_GCP_SERVICE_ACCOUNT:
        required: false
      MYPAGE_PLAN_HMAC_KEY:
        required: false
      MYPAGE_RUNTIME_SETTINGS_JSON:
        required: false

permissions:
  contents: read

jobs:
  validate-selection:
    name: Validate Operation Selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPERATION: ${{ inputs.operation }}
      ENVIRONMENT: ${{ inputs.environment }}
      REPOSITORY_RESULT: ${{ inputs.repository_result }}
      FRONTEND_RESULT: ${{ inputs.frontend_result }}
      SYSTEM_RESULT: ${{ inputs.system_result }}
      TOOLS_RESULT: ${{ inputs.tools_result }}
      INFRA_RESULT: ${{ inputs.infra_result }}
      GCP_TERRAFORM_VALIDATE_RESULT: ${{ inputs.gcp_terraform_validate_result }}
    steps:
      - name: Require supported operation and validation prerequisites
        run: |
          set -euo pipefail

          case "${OPERATION}" in
            gcp-plan|gcp-apply|gcp-user-activity-schema-audit|mypage-image-build|mypage-hosting-release|mypage-backend-release) ;;
            *)
              echo "::error::Unsupported authenticated operation"
              exit 1
              ;;
          esac

          case "${ENVIRONMENT}" in
            development|production) ;;
            *)
              echo "::error::Unsupported environment"
              exit 1
              ;;
          esac

          if [[ "${REPOSITORY_RESULT}" != "success" ]]; then
            echo "::error::Repository validation must succeed before an authenticated operation"
            exit 1
          fi

          for result in "${FRONTEND_RESULT}" "${SYSTEM_RESULT}" "${TOOLS_RESULT}" "${INFRA_RESULT}" "${GCP_TERRAFORM_VALIDATE_RESULT}"; do
            case "${result}" in
              success|skipped) ;;
              *)
                echo "::error::Credentialless validation failed before authenticated operation"
                exit 1
                ;;
            esac
          done

          if [[ "${OPERATION}" != "gcp-user-activity-schema-audit" ]]; then
            if [[ "${GCP_TERRAFORM_VALIDATE_RESULT}" != "success" || "${SYSTEM_RESULT}" != "success" ||
                  "${FRONTEND_RESULT}" != "success" || "${TOOLS_RESULT}" != "success" || "${INFRA_RESULT}" != "success" ]]; then
              echo "::error::Full credentialless CI must succeed before a write-capable operation"
              exit 1
            fi
          fi

          case "${OPERATION}" in
            gcp-plan|gcp-apply|mypage-image-build) ;;
            gcp-user-activity-schema-audit)
              [[ "${ENVIRONMENT}" == "development" ]] || {
                echo "::error::Schema audit is development-only"
                exit 1
              }
              [[ "${GCP_TERRAFORM_VALIDATE_RESULT}" == "success" ]] || {
                echo "::error::GCP Terraform validation must succeed before schema audit"
                exit 1
              }
              ;;
            mypage-hosting-release)
              [[ "${ENVIRONMENT}" == "development" ]] || {
                echo "::error::MyPage Hosting release is development-only"
                exit 1
              }
              ;;
            mypage-backend-release)
              [[ "${ENVIRONMENT}" == "development" ]] || {
                echo "::error::MyPage Backend release is development-only"
                exit 1
              }
              ;;
          esac

  gcp-infrastructure:
    name: GCP Infrastructure
    needs: validate-selection
    if: ${{ inputs.operation == 'gcp-plan' || inputs.operation == 'gcp-apply' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-infrastructure-authenticated.yml
    with:
      environment: ${{ inputs.environment }}
      action: ${{ inputs.operation == 'gcp-apply' && 'apply' || 'plan' }}
    secrets:
      GCP_TERRAFORM_NORMAL_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_NORMAL_WIF_PROVIDER }}
      GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT }}
      AWS_TERRAFORM_BACKEND_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ARN }}
      AWS_TERRAFORM_BACKEND_ROLE_ID: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ID }}
      AWS_TERRAFORM_STATE_BUCKET: ${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}
      AWS_TERRAFORM_STATE_ACCOUNT_ID: ${{ secrets.AWS_TERRAFORM_STATE_ACCOUNT_ID }}
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      GCP_TERRAFORM_MANAGED_INPUTS_JSON: ${{ secrets.GCP_TERRAFORM_MANAGED_INPUTS_JSON }}
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      MYPAGE_RUNTIME_SETTINGS_JSON: ${{ secrets.MYPAGE_RUNTIME_SETTINGS_JSON }}

  gcp-user-activity-schema-audit:
    name: GCP User Activity Schema Audit
    needs: validate-selection
    if: ${{ inputs.operation == 'gcp-user-activity-schema-audit' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-user-activity-schema-audit.yml
    secrets:
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT: ${{ secrets.GCP_USER_ACTIVITY_SCHEMA_AUDIT_SERVICE_ACCOUNT }}
    with:
      target: dev

  mypage-image-build:
    name: MyPage Image Build
    needs: validate-selection
    if: ${{ inputs.operation == 'mypage-image-build' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-foundation-authenticated.yml
    with:
      target: ${{ inputs.environment }}
      mode: image-build
      expected_sha: ${{ github.sha }}
    secrets:
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      MYPAGE_RUNTIME_SETTINGS_JSON: ${{ secrets.MYPAGE_RUNTIME_SETTINGS_JSON }}

  mypage-hosting-authenticated:
    name: MyPage DEV Hosting Release
    needs: validate-selection
    if: ${{ inputs.operation == 'mypage-hosting-release' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-hosting-authenticated.yml
    with:
      expected_sha: ${{ github.sha }}
      other_operation: false

  mypage-backend-authenticated:
    name: MyPage DEV Backend Release
    needs: validate-selection
    if: ${{ inputs.operation == 'mypage-backend-release' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-backend-authenticated.yml
    with:
      expected_sha: ${{ github.sha }}
      other_operation: false
    secrets:
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      MYPAGE_RUNTIME_SETTINGS_JSON: ${{ secrets.MYPAGE_RUNTIME_SETTINGS_JSON }}
