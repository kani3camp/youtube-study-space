name: CI Infra

on:
  workflow_call:

permissions:
  contents: read

jobs:
  aws-cdk-test:
    name: AWS CDK Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: aws-cdk
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: aws-cdk/package.json
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"
          cache-dependency-path: aws-cdk/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Run CDK synth
        run: pnpm cdk:synth
