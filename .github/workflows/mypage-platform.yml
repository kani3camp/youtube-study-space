name: MyPage Platform Terraform

on:
  pull_request:
    paths:
      - 'infra/mypage-platform/**'
      - '.github/workflows/mypage-platform.yml'
      - '.github/scripts/detect-ci-paths.sh'
      - '.github/scripts/test-detect-ci-paths.sh'
  workflow_dispatch:

# Pure Terraform source validation; no cloud trust or state access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-credentialless:
    name: MyPage Platform Mock Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Terraform version
        id: terraform-version
        run: echo "version=$(cat infra/mypage-platform/.terraform-version)" >> "$GITHUB_OUTPUT"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false
      - name: Validate dev/prod without credentials
        run: bash infra/mypage-platform/scripts/check-local.sh
