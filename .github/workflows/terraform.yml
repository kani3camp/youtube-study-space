name: Terraform

# Entry point registered on the default branch only. GitHub accepts
# workflow_dispatch only for workflow files that exist on the default branch,
# but runs the file of the selected ref. The real workflow lives on
# integration/mypage-canon-20261006 (Issue #1500); select that branch in
# "Use workflow from". This file is replaced when the integration branch
# reaches dev. Keep the inputs identical to the integration branch's file.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      operation:
        description: plan only, or plan then apply
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      component:
        description: Terraform roots to operate on
        required: true
        default: all
        type: choice
        options:
          - all
          - core
          - mypage

permissions: {}

jobs:
  integration-only:
    name: Run from the integration branch
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse to run from this ref
        run: |
          echo "::error::Run Terraform with 'Use workflow from: integration/mypage-canon-20261006'. This ref only registers the entry point."
          exit 1
