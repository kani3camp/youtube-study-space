name: Terraform

# Manual Plan / Apply of the Core GCP root and the MyPage root. Each root keeps
# its own State, identity and saved-plan verification. Apply always re-plans in
# its own job and applies that job's plan only when it matches the Plan job.
# Production Apply requires the GitHub Environment approval of
# terraform-prod-apply (and mypage-prod-apply when MyPage production exists).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      operation:
        description: plan only, or plan then apply
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      component:
        description: Terraform roots to operate on
        required: true
        default: all
        type: choice
        options:
          - all
          - core
          - mypage

permissions:
  contents: read

# DEV joins the existing Cloud Run change lock during the migration period
# (docs/development/ci-cd-workflows.md 3.5).
concurrency:
  group: ${{ inputs.environment == 'development' && 'mypage-dev-runtime-change' || 'gcp-infrastructure-production' }}
  cancel-in-progress: false

jobs:
  select:
    name: Validate Terraform Request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.select.outputs.target }}
      mypage_stage: ${{ steps.select.outputs.mypage_stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a supported selection and resolve the reviewed MyPage stage
        id: select
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          case "${ENVIRONMENT}" in
            development) target=dev ;;
            production) target=prod ;;
            *) echo "::error::Unsupported environment"; exit 1 ;;
          esac
          case "${OPERATION}:${COMPONENT}" in
            plan:all|plan:core|plan:mypage|apply:all|apply:core|apply:mypage) ;;
            *) echo "::error::Unsupported operation or component"; exit 1 ;;
          esac
          file="infra/mypage-platform/environments/${target}/desired-stage.txt"
          [[ -f "${file}" && ! -L "${file}" ]] || { echo "::error::Missing reviewed MyPage desired stage"; exit 1; }
          stage="$(tr -d '[:space:]' < "${file}")"
          case "${stage}" in
            disabled|foundation_metadata|foundation|registry|maintenance_operator|maintenance_upgrade|runtime_private|runtime_public) ;;
            *) echo "::error::Invalid reviewed MyPage desired stage"; exit 1 ;;
          esac
          if [[ "${COMPONENT}" == "mypage" && "${stage}" == "disabled" ]]; then
            echo "::error::MyPage is disabled for this environment; nothing to operate on."
            exit 1
          fi
          {
            echo "target=${target}"
            echo "mypage_stage=${stage}"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Credentialless Terraform Validation
    needs: select
    # The integration ruleset requires CI Gate on each PR but not on the exact
    # merged tree; re-run the Terraform checks for this commit first.
    uses: ./.github/workflows/ci-gcp-terraform.yml

  core-plan:
    name: Core Plan
    needs: [select, validate]
    if: ${{ (inputs.component == 'all' || inputs.component == 'core') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-terraform-authenticated.yml
    with:
      target: ${{ needs.select.outputs.target }}
      mode: normal-plan
      expected_sha: ${{ github.sha }}
    secrets:
      GCP_TERRAFORM_NORMAL_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_NORMAL_WIF_PROVIDER }}
      GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT }}
      AWS_TERRAFORM_BACKEND_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ARN }}
      AWS_TERRAFORM_BACKEND_ROLE_ID: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ID }}
      AWS_TERRAFORM_STATE_BUCKET: ${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}
      AWS_TERRAFORM_STATE_ACCOUNT_ID: ${{ secrets.AWS_TERRAFORM_STATE_ACCOUNT_ID }}
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      GCP_TERRAFORM_MANAGED_INPUTS_JSON: ${{ secrets.GCP_TERRAFORM_MANAGED_INPUTS_JSON }}

  mypage-plan:
    name: MyPage Plan
    needs: [select, validate]
    if: ${{ (inputs.component == 'all' || inputs.component == 'mypage') && needs.select.outputs.mypage_stage != 'disabled' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-foundation-authenticated.yml
    with:
      target: ${{ inputs.environment }}
      mode: desired-plan
      expected_sha: ${{ github.sha }}
    secrets:
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      MYPAGE_RUNTIME_SETTINGS_JSON: ${{ secrets.MYPAGE_RUNTIME_SETTINGS_JSON }}

  # Both selected Plans must succeed before any Apply starts.
  core-apply:
    name: Core Apply
    needs: [select, core-plan, mypage-plan]
    if: ${{ always() && inputs.operation == 'apply' && (inputs.component == 'all' || inputs.component == 'core') && needs.core-plan.result == 'success' && (needs.mypage-plan.result == 'success' || needs.mypage-plan.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gcp-terraform-authenticated.yml
    with:
      target: ${{ needs.select.outputs.target }}
      mode: normal-apply
      expected_sha: ${{ github.sha }}
    secrets:
      GCP_TERRAFORM_NORMAL_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_NORMAL_WIF_PROVIDER }}
      GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT }}
      AWS_TERRAFORM_BACKEND_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ARN }}
      AWS_TERRAFORM_BACKEND_ROLE_ID: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ID }}
      AWS_TERRAFORM_STATE_BUCKET: ${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}
      AWS_TERRAFORM_STATE_ACCOUNT_ID: ${{ secrets.AWS_TERRAFORM_STATE_ACCOUNT_ID }}
      GCP_TERRAFORM_WIF_PROVIDER: ${{ secrets.GCP_TERRAFORM_WIF_PROVIDER }}
      GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      GCP_TERRAFORM_MANAGED_INPUTS_JSON: ${{ secrets.GCP_TERRAFORM_MANAGED_INPUTS_JSON }}

  mypage-apply:
    name: MyPage Apply
    needs: [select, core-plan, mypage-plan, core-apply]
    if: ${{ always() && inputs.operation == 'apply' && (inputs.component == 'all' || inputs.component == 'mypage') && needs.mypage-plan.result == 'success' && (needs.core-plan.result == 'success' || needs.core-plan.result == 'skipped') && (needs.core-apply.result == 'success' || (inputs.component == 'mypage' && needs.core-apply.result == 'skipped')) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-foundation-authenticated.yml
    with:
      target: ${{ inputs.environment }}
      mode: desired-apply
      expected_sha: ${{ github.sha }}
    secrets:
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      MYPAGE_RUNTIME_SETTINGS_JSON: ${{ secrets.MYPAGE_RUNTIME_SETTINGS_JSON }}

  gate:
    name: Terraform Gate
    if: ${{ always() }}
    needs: [select, validate, core-plan, mypage-plan, core-apply, mypage-apply]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPERATION: ${{ inputs.operation }}
      COMPONENT: ${{ inputs.component }}
      MYPAGE_STAGE: ${{ needs.select.outputs.mypage_stage }}
      SELECT_RESULT: ${{ needs.select.result }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      CORE_PLAN_RESULT: ${{ needs.core-plan.result }}
      MYPAGE_PLAN_RESULT: ${{ needs.mypage-plan.result }}
      CORE_APPLY_RESULT: ${{ needs.core-apply.result }}
      MYPAGE_APPLY_RESULT: ${{ needs.mypage-apply.result }}
    steps:
      - name: Require every selected Plan and Apply to succeed
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "${SELECT_RESULT}" == "success" && "${VALIDATE_RESULT}" == "success" ]] || fail "Selection or credentialless validation did not succeed"
          case "${OPERATION}" in
            apply) apply=true ;;
            plan) apply=false ;;
            *) fail "Unsupported operation" ;;
          esac
          core=false
          mypage=false
          if [[ "${COMPONENT}" == "all" || "${COMPONENT}" == "core" ]]; then core=true; fi
          if [[ ( "${COMPONENT}" == "all" || "${COMPONENT}" == "mypage" ) && "${MYPAGE_STAGE}" != "disabled" ]]; then mypage=true; fi
          # expect <name> <selected> <result>: selected jobs must succeed, others must skip.
          expect() {
            if [[ "$2" == "true" ]]; then
              [[ "$3" == "success" ]] || fail "$1 must succeed"
            else
              [[ "$3" == "skipped" ]] || fail "$1 must not run"
            fi
          }
          expect "Core Plan" "${core}" "${CORE_PLAN_RESULT}"
          expect "MyPage Plan" "${mypage}" "${MYPAGE_PLAN_RESULT}"
          if [[ "${core}" == true && "${apply}" == true ]]; then core_apply=true; else core_apply=false; fi
          if [[ "${mypage}" == true && "${apply}" == true ]]; then mypage_apply=true; else mypage_apply=false; fi
          expect "Core Apply" "${core_apply}" "${CORE_APPLY_RESULT}"
          expect "MyPage Apply" "${mypage_apply}" "${MYPAGE_APPLY_RESULT}"
