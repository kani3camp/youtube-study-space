name: Deploy MyPage Frontend

# Builds this commit and publishes only the DEV Firebase Hosting site. It never
# changes Cloud Run or Terraform. Production stays absent until the public
# release gate (#1133) approves a separate identity.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Credentialless MyPage Validation
    # The integration ruleset requires CI Gate on each PR but not on the exact
    # merged tree; re-run the deployed domain's checks for this commit.
    uses: ./.github/workflows/ci-frontend.yml
    with:
      youtube_monitor: false
      docs_site: false
      mypage: true

  hosting:
    name: Deploy DEV Hosting
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-hosting-authenticated.yml
    with:
      expected_sha: ${{ github.sha }}
