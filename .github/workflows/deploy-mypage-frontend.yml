name: Deploy MyPage Frontend
run-name: Deploy Frontend ${{ inputs.environment }}

# Builds this commit and publishes only the selected environment's Firebase
# Hosting site. It never changes Cloud Run or Terraform. DEV runs only from the
# integration branch and Production only from main; the release script and the
# per-environment WIF trust both enforce it.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (development runs from the integration branch, production from main)
        required: true
        default: development
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

jobs:
  select:
    name: Validate Deploy Selection
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      TARGET: ${{ inputs.environment }}
    steps:
      - name: Record dispatch inputs
        env:
          DISPATCH_INPUTS: environment
          DISPATCH_VALUE_ENVIRONMENT: ${{ inputs.environment }}
          DISPATCH_DEFAULT_ENVIRONMENT: development
        # Records only the inputs listed in DISPATCH_INPUTS, before any credential.
        # Values arrive through env only and are escaped for a Markdown table.
        # continue-on-error: recording never changes whether the run proceeds.
        continue-on-error: true
        run: |
          python3 -I - <<'PY'
          import os
          import re
          import unicodedata

          VISIBLE = {'\n': 'n', '\r': 'r', '\t': 't'}

          def cell(value):
              if value is None:
                  return '（定義なし）'
              if value == '':
                  return '（空文字）'
              out = []
              for char in value:
                  if char in VISIBLE:
                      out.append('&#92;' + VISIBLE[char])
                  elif unicodedata.category(char) in ('Cc', 'Cf', 'Cs', 'Co', 'Cn', 'Zl', 'Zp'):
                      out.append('&#92;u{%04x}' % ord(char))
                  elif char.isascii() and not char.isalnum() and char != ' ':
                      out.append('&#%d;' % ord(char))
                  else:
                      out.append(char)
              return '<code>' + ''.join(out) + '</code>'

          names = os.environ['DISPATCH_INPUTS'].split()
          lines = ['## 手動実行の入力値', '', '| 入力 | 値 | 既定値 |', '| --- | --- | --- |']
          for name in names:
              if not re.fullmatch(r'[a-z][a-z0-9_]*', name):
                  raise SystemExit('Unsupported input name: ' + name)
              key = name.upper()
              value = os.environ['DISPATCH_VALUE_' + key]
              lines.append('| `%s` | %s | %s |' % (name, cell(value), cell(os.environ.get('DISPATCH_DEFAULT_' + key))))
          lines += ['', '実行コンテキスト（選択入力ではありません）', '', '| 項目 | 値 |', '| --- | --- |']
          for name in ('event_name', 'ref', 'sha', 'actor', 'triggering_actor', 'run_attempt'):
              lines.append('| `%s` | %s |' % (name, cell(os.environ.get('GITHUB_' + name.upper(), ''))))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n\n')
          PY
      - name: Require the target's own branch
        run: |
          set -euo pipefail
          case "${TARGET}:${GITHUB_REF}" in
            development:refs/heads/dev|production:refs/heads/main) ;;
            *)
              echo "::error::Each environment deploys only from its own branch."
              exit 1
              ;;
          esac

  validate:
    name: Credentialless MyPage Validation
    needs: select
    # The integration ruleset requires CI Gate on each PR but not on the exact
    # merged tree; re-run the deployed domain's checks for this commit.
    uses: ./.github/workflows/ci-frontend.yml
    with:
      youtube_monitor: false
      docs_site: false
      mypage: true

  hosting:
    name: Deploy Hosting
    needs: [select, validate]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mypage-hosting-authenticated.yml
    with:
      environment: ${{ inputs.environment }}
      expected_sha: ${{ github.sha }}
