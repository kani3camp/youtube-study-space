name: CodeQL Source Contracts

on:
  pull_request:
    paths:
      - .github/codeql/**
      - .github/workflows/codeql-source-contracts.yml
  push:
    branches: [dev, feature/codeql-advanced-setup]
    paths:
      - .github/codeql/**
      - .github/workflows/codeql-source-contracts.yml

permissions:
  contents: read
  security-events: none
  id-token: none

jobs:
  source-contracts:
    name: CodeQL Source Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install parser
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r .github/codeql/requirements.txt
      - name: Check source contracts
        run: python .github/codeql/validate-source.py && python -m unittest discover -s .github/codeql -p 'test_*.py' -v
      - name: Install pinned actionlint
        run: bash .github/codeql/install-actionlint.sh "$RUNNER_TEMP/codeql-source-tools"
      - name: Lint inert templates and static workflow
        run: |
          python .github/codeql/lint-templates.py --actionlint "$RUNNER_TEMP/codeql-source-tools/actionlint"
          "$RUNNER_TEMP/codeql-source-tools/actionlint" -shellcheck= -pyflakes= .github/workflows/codeql-source-contracts.yml
      - name: Check shell syntax and existing CI routing
        run: |
          bash -n .github/codeql/build-go.sh .github/codeql/install-actionlint.sh
          bash .github/scripts/test-detect-ci-paths.sh
