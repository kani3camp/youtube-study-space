name: MyPage Browser HTTP QA

on:
  pull_request:
    paths:
      - 'mypage/**'
      - 'system/core/mypage/**'
      - '.github/workflows/mypage-browser-http-qa.yml'

# Synthetic localhost HTTP acceptance only. No OIDC, secrets, environments,
# real Google/Firebase traffic, deployment, or authenticated Terraform access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-http-acceptance:
    name: MyPage Browser to Go HTTP (localhost)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-youtube-study-space-ci
      GOOGLE_CLOUD_PROJECT: demo-youtube-study-space-ci
      FIREBASE_PROJECT_ID: demo-youtube-study-space-ci
      MYPAGE_BROWSER_HTTP_QA: '1'
      MYPAGE_QA_VITE: http://127.0.0.1:18081
      MYPAGE_QA_OUTPUT: ${{ runner.temp }}/mypage-browser-http
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: mypage/package.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: system/go.mod
          cache: true
          cache-dependency-path: |
            system/go.mod
            system/go.sum

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test-only tools and dependencies
        run: |
          set -euo pipefail
          npm install --global firebase-tools@15.25.1
          (cd mypage && pnpm install --frozen-lockfile)
          (cd system && go mod download)
          python3 -m pip install -r mypage/visual-requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Use pinned Playwright Chromium for local QA
        run: |
          set -euo pipefail
          chromium="$(python3 -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$chromium"
          sudo ln -sfn "$chromium" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Exercise browser through localhost HTTPS and actual Go handler
        run: |
          set -euo pipefail
          mkdir -p "$MYPAGE_QA_OUTPUT"
          (
            cd mypage
            pnpm dev --host 127.0.0.1 --port 18081 --strictPort
          ) > "$RUNNER_TEMP/mypage-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18081/http-qa.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:18081/http-qa.html

          firebase emulators:exec \
            --config firebase/firebase.json \
            --project demo-youtube-study-space-ci \
            --only firestore \
            --log-verbosity INFO \
            "cd system && go test -tags=integration -run '^TestBrowserHTTPDemo$' -count=1 -v ./core/mypage"
