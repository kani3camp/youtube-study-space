name: CI Repository

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to validate, pinned by the CI controller
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Repository Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted validation controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare isolated validation tools
        uses: ./.github/actions/prepare-ci-validation
      - name: Checkout exact validation source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: .ci-source
          persist-credentials: false
      - name: Run four isolated validations
        env:
          VALIDATION_SHA: ${{ inputs.source_sha }}
        run: |
          # Do not expose runner tokens, command files or the Docker socket to target code.
          marker="$(openssl rand -hex 32)"
          echo "::stop-commands::${marker}"
          result=0
          summary_rows=''
          for kind in base-image node-policy docs contracts; do
            # Each invocation gets fresh writable tmpfs; only the source is shared read-only.
            if docker run --rm --init --read-only --network=none \
              --cap-drop=ALL --security-opt=no-new-privileges \
              --pids-limit=256 --memory=6g --cpus=2 \
              --tmpfs /tmp:rw,exec,mode=1777 \
              --tmpfs /work:rw,exec,uid=10001,gid=10001,mode=0700 \
              --mount "type=bind,src=${GITHUB_WORKSPACE}/.ci-source,dst=/source,readonly" \
              --env "CI_SOURCE_SHA=${VALIDATION_SHA}" \
              yss-ci-validation:local "$kind"; then
              status=0
              printf '%s: PASS\n' "$kind"
            else
              status=$?
              printf '%s: FAIL (exit %s)\n' "$kind" "$status"
              result=1
            fi
            # Only fixed host-side labels and Docker exit status reach the summary.
            if [[ "$status" -eq 0 ]]; then
              summary_rows+="| ${kind} | PASS |"$'\n'
            else
              summary_rows+="| ${kind} | FAIL (exit ${status}) |"$'\n'
            fi
          done
          echo "::${marker}::"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              printf '### Repository validation\n\n| Validation | Result |\n| --- | --- |\n'
              printf '%s' "$summary_rows"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
