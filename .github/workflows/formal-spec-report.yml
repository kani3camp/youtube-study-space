name: Formal Spec Report

on:
  pull_request:
    paths:
      - "formal-spec/**"
      - ".github/workflows/formal-spec-report.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: FSL HTML Reports
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pinned FSL tool
        uses: actions/cache@v6
        with:
          path: formal-spec/fsl/.tools
          key: ${{ runner.os }}-fsl-${{ hashFiles('formal-spec/fsl/VERSION', 'formal-spec/fsl/SHA256SUMS') }}

      - name: Generate self-contained HTML reports
        shell: bash
        run: |
          set -euo pipefail
          for spec in formal-spec/fsl/specs/*.fsl; do
            name="$(basename "$spec" .fsl)"
            bash formal-spec/fsl/scripts/report.sh "$name"
          done

      - name: Upload HTML review reports
        uses: actions/upload-artifact@v7
        with:
          name: fsl-spec-reports
          path: formal-spec/fsl/generated/reports/*.html
          if-no-files-found: error
          retention-days: 14
