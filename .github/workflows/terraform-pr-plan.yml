name: Terraform PR Plan

# Advisory native Plan for a same-repository PR by the owner. It uses the
# PR Plan identity of each root (read-only GCP SA, State-read-only AWS role),
# runs with -lock=false and emits no commitment, saved plan or timestamp, so no
# Apply can consume anything from this run. Manual Apply always re-plans.
on:
  workflow_call:
    inputs:
      target:
        description: dev or prod (MyPage supports dev only)
        required: true
        type: string
      component:
        description: core or mypage
        required: true
        type: string
      pr_number:
        required: true
        type: string
      head_repository:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
    secrets:
      GCP_TERRAFORM_NORMAL_WIF_PROVIDER:
        required: false
      GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT:
        required: false
      AWS_TERRAFORM_BACKEND_ROLE_ARN:
        required: false
      AWS_TERRAFORM_BACKEND_ROLE_ID:
        required: false
      AWS_TERRAFORM_STATE_BUCKET:
        required: false
      AWS_TERRAFORM_STATE_ACCOUNT_ID:
        required: false
      GCP_TERRAFORM_MANAGED_INPUTS_JSON:
        required: false
      MYPAGE_STATE_BUCKET:
        required: false
      MYPAGE_STATE_ACCOUNT:
        required: false
      MYPAGE_BACKEND_ROLE_ARN:
        required: false
      MYPAGE_BACKEND_ROLE_ID:
        required: false
      MYPAGE_GCP_WIF_PROVIDER:
        required: false
      MYPAGE_GCP_SERVICE_ACCOUNT:
        required: false
      MYPAGE_PLAN_HMAC_KEY:
        required: false
      MYPAGE_RUNTIME_SETTINGS_JSON:
        required: false

permissions: {}

env:
  TERRAFORM_VERSION: "1.16.4"
  STATE_AWS_REGION: ap-northeast-1

jobs:
  core:
    name: "Core PR Plan (${{ inputs.target }})"
    if: ${{ inputs.component == 'core' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: terraform-${{ inputs.target }}-pr-plan
    permissions:
      contents: read
      id-token: write
    env:
      NORMAL_TARGET: ${{ inputs.target }}
      NORMAL_MODE: pr-plan
      NORMAL_ROLE: pr-plan
      NORMAL_EXPECTED_SHA: ${{ inputs.expected_sha }}
      NORMAL_PR_NUMBER: ${{ inputs.pr_number }}
      NORMAL_PR_HEAD_REPOSITORY: ${{ inputs.head_repository }}
      TF_WORKSPACE: default
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
      STATE_BUCKET: ${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}
      STATE_ACCOUNT_ID: ${{ secrets.AWS_TERRAFORM_STATE_ACCOUNT_ID }}
      BACKEND_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ARN }}
      BACKEND_ROLE_ID: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ID }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout PR merge source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit only the owner's same-repository PR before credentials
        env:
          NORMAL_INPUTS_JSON: ${{ secrets.GCP_TERRAFORM_MANAGED_INPUTS_JSON }}
        run: python3 infra/gcp/scripts/terraform_normal_ops.py stage
      - name: Mask identity fragments
        shell: bash
        env:
          PRIVATE_WIF: ${{ secrets.GCP_TERRAFORM_NORMAL_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          for value in "${BACKEND_ROLE_ID}" "${BACKEND_ROLE_ARN##*/}" "${GCP_SERVICE_ACCOUNT%%@*}" "${STATE_BUCKET}"; do
            [[ -n "${value}" ]] && echo "::add-mask::${value}"
          done
          project_number="$(cut -d/ -f2 <<< "${PRIVATE_WIF}")"
          [[ -n "${project_number}" ]] && echo "::add-mask::${project_number}"
      - name: Verify OIDC claims
        run: python3 infra/gcp/scripts/terraform_normal_ops.py oidc
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Configure State-read-only backend identity
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.STATE_AWS_REGION }}
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 1
      - name: Configure read-only GCP identity
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_TERRAFORM_NORMAL_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_NORMAL_SERVICE_ACCOUNT }}
          project_id: ${{ inputs.target == 'dev' && 'test-youtube-study-space' || 'youtube-study-space' }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
          token_format: access_token
          access_token_lifetime: 1800s
      - name: Plan without the State lock and publish a value-free summary
        env:
          NORMAL_INPUTS_JSON: ${{ secrets.GCP_TERRAFORM_MANAGED_INPUTS_JSON }}
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: python3 infra/gcp/scripts/terraform_normal_ops.py execute
      - name: Remove private Terraform files
        if: ${{ always() }}
        run: python3 infra/gcp/scripts/terraform_normal_ops.py cleanup

  mypage:
    name: "MyPage PR Plan (${{ inputs.target }})"
    if: ${{ inputs.component == 'mypage' && inputs.target == 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mypage-dev-pr-plan
    permissions:
      contents: read
      id-token: write
    env:
      MYPAGE_TARGET: development
      MYPAGE_MODE: desired-plan
      MYPAGE_ROLE: pr-plan
      MYPAGE_EXPECTED_SHA: ${{ inputs.expected_sha }}
      MYPAGE_PR_NUMBER: ${{ inputs.pr_number }}
      MYPAGE_PR_HEAD_REPOSITORY: ${{ inputs.head_repository }}
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      MYPAGE_RUNTIME_SETTINGS_JSON: ${{ secrets.MYPAGE_RUNTIME_SETTINGS_JSON }}
      TF_WORKSPACE: default
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
    steps:
      - name: Checkout PR merge source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit only the owner's same-repository PR before credentials
        run: python3 infra/mypage-platform/scripts/foundation_ops.py stage
      - name: Verify exact OIDC source and actor
        run: python3 infra/mypage-platform/scripts/foundation_ops.py oidc
      - name: Read pinned Terraform version
        id: version
        run: echo "value=$(cat infra/mypage-platform/.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.value }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: gcp
        with:
          workload_identity_provider: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
          project_id: test-youtube-study-space
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
          token_format: access_token
          access_token_lifetime: 1800s
      - name: Plan without the State lock against the plan contract
        env:
          MYPAGE_GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: python3 infra/mypage-platform/scripts/foundation_ops.py execute
      - name: Remove private evidence
        if: ${{ always() }}
        run: python3 infra/mypage-platform/scripts/foundation_ops.py cleanup
