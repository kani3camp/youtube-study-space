name: MyPage Foundation Authenticated

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
    secrets:
      MYPAGE_STATE_BUCKET:
        required: false
      MYPAGE_STATE_ACCOUNT:
        required: false
      MYPAGE_BACKEND_ROLE_ARN:
        required: false
      MYPAGE_BACKEND_ROLE_ID:
        required: false
      MYPAGE_GCP_WIF_PROVIDER:
        required: false
      MYPAGE_GCP_SERVICE_ACCOUNT:
        required: false
      MYPAGE_PLAN_HMAC_KEY:
        required: false

permissions:
  contents: read

# A Foundation Apply cannot race a Plan or another Apply on the same State.
concurrency:
  group: mypage-development-foundation
  cancel-in-progress: false

jobs:
  foundation_plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mypage-dev-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      commitment: ${{ steps.plan.outputs.commitment }}
      plan_time: ${{ steps.plan.outputs.plan_time }}
    env:
      MYPAGE_MODE: ${{ inputs.mode }}
      MYPAGE_ROLE: plan
      MYPAGE_EXPECTED_SHA: ${{ inputs.expected_sha }}
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      TF_WORKSPACE: default
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preflight without cloud credentials
        run: python3 infra/mypage-platform/scripts/foundation_ops.py stage
      - name: Verify exact OIDC source and actor
        run: python3 infra/mypage-platform/scripts/foundation_ops.py oidc
      - name: Read pinned Terraform version
        id: version
        run: echo "value=$(cat infra/mypage-platform/.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.value }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: gcp
        with:
          workload_identity_provider: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
          project_id: test-youtube-study-space
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
          token_format: access_token
          access_token_lifetime: 1800s
      - name: Plan eight private foundation resources
        id: plan
        env:
          MYPAGE_GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: python3 infra/mypage-platform/scripts/foundation_ops.py execute
      - name: Remove private evidence
        if: ${{ always() }}
        run: python3 infra/mypage-platform/scripts/foundation_ops.py cleanup

  foundation_apply:
    needs: foundation_plan
    if: ${{ inputs.mode == 'foundation-apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mypage-dev-apply
    permissions:
      contents: read
      id-token: write
    env:
      MYPAGE_MODE: ${{ inputs.mode }}
      MYPAGE_ROLE: apply
      MYPAGE_EXPECTED_SHA: ${{ inputs.expected_sha }}
      MYPAGE_STATE_BUCKET: ${{ secrets.MYPAGE_STATE_BUCKET }}
      MYPAGE_STATE_ACCOUNT: ${{ secrets.MYPAGE_STATE_ACCOUNT }}
      MYPAGE_BACKEND_ROLE_ARN: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
      MYPAGE_BACKEND_ROLE_ID: ${{ secrets.MYPAGE_BACKEND_ROLE_ID }}
      MYPAGE_GCP_WIF_PROVIDER: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
      MYPAGE_GCP_SERVICE_ACCOUNT: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
      MYPAGE_PLAN_HMAC_KEY: ${{ secrets.MYPAGE_PLAN_HMAC_KEY }}
      TF_WORKSPACE: default
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preflight without cloud credentials
        run: python3 infra/mypage-platform/scripts/foundation_ops.py stage
      - name: Verify exact OIDC source and actor
        run: python3 infra/mypage-platform/scripts/foundation_ops.py oidc
      - name: Read pinned Terraform version
        id: version
        run: echo "value=$(cat infra/mypage-platform/.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.value }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.MYPAGE_BACKEND_ROLE_ARN }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: gcp
        with:
          workload_identity_provider: ${{ secrets.MYPAGE_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.MYPAGE_GCP_SERVICE_ACCOUNT }}
          project_id: test-youtube-study-space
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
          token_format: access_token
          access_token_lifetime: 1800s
      - name: Independently reproduce saved Plan
        id: prepared
        env:
          MYPAGE_GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: python3 infra/mypage-platform/scripts/foundation_ops.py execute
      # HMAC outputs stay in the expression engine, never runner env/with logs.
      - name: Apply matching saved Plan
        id: applied
        if: ${{ steps.prepared.outputs.commitment == needs.foundation_plan.outputs.commitment && steps.prepared.outputs.commitment != '' }}
        env:
          MYPAGE_PLAN_TIME: ${{ needs.foundation_plan.outputs.plan_time }}
        run: python3 infra/mypage-platform/scripts/foundation_ops.py apply
      - name: Reject missing Plan agreement or incomplete Apply
        if: ${{ always() && steps.prepared.outcome == 'success' && steps.applied.outcome != 'success' }}
        run: exit 1
      - name: Remove private evidence
        if: ${{ always() }}
        run: python3 infra/mypage-platform/scripts/foundation_ops.py cleanup
