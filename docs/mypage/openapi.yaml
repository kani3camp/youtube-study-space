          supportRequestRef:
            type: string
            pattern: ^[a-f0-9]{64}$
            description: 認証付き状態照会用にサーバーで結び付けたSupportRequestレコード参照。導入時に追加する項目であり、本人確認参照とは引き続き分ける。
      discriminator:
        propertyName: purpose
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - INVALID_REQUEST
              - PAYLOAD_TOO_LARGE
              - PRIVACY_CONSENT_REQUIRED
              - POLICY_VERSION_OUTDATED
              - AUTH_REQUIRED
              - APP_CHECK_REQUIRED
              - OAUTH_TRANSACTION_REQUIRED
              - OAUTH_TRANSACTION_PENDING
              - OAUTH_TRANSACTION_EXPIRED
              - OAUTH_TRANSACTION_CONSUMED
              - OAUTH_TRANSACTION_CHANGED
              - PRIVACY_RECONSENT_REQUIRED
              - SERVICE_ACCESS_RESTRICTED
              - DATA_DELETION_IN_PROGRESS
              - SUPPORT_CHALLENGE_INVALID
              - SUPPORT_CHANNEL_MISMATCH
              - INTAKE_KEY_CONFLICT
              - OAUTH_FAILED
              - OAUTH_SCOPE_INSUFFICIENT
              - CHANNEL_UNAVAILABLE
              - CHANNEL_AMBIGUOUS
              - WEB_ACCOUNT_REQUIRED
              - RATE_LIMITED
              - MAINTENANCE_ACTIVE
              - FEATURE_UNAVAILABLE
              - INVALID_CURSOR
              - HISTORY_NOT_READY
              - HISTORY_LIMIT_EXCEEDED
              - OPERATION_ALREADY_CONSUMED
              - ANALYSIS_BUDGET_EXHAUSTED
              - TEMPORARY_UNAVAILABLE
              - INTERNAL_ERROR
            message:
              type: string
            requestId:
              type: string
              minLength: 1
          required:
          - code
          - message
          - requestId
      required:
      - error
